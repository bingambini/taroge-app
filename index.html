<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shoes Store - Optimized 2.6</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8f9fc; margin: 0; padding-bottom: 120px; overflow-x: hidden; }
        
        /* --- Kinetic Shoe Preloader Styles --- */
        #app-preloader { position: fixed; inset: 0; z-index: 999999; background: #ffffff; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.5s ease-out; }
        .loader-container { position: relative; display: flex; flex-direction: column; align-items: center; }
        .shoe-icon { font-size: 50px; color: #2563eb; animation: kineticShoe 1.2s ease-in-out infinite; filter: drop-shadow(0 5px 15px rgba(37, 99, 235, 0.2)); }
        .shoe-shadow { width: 40px; height: 6px; background: rgba(0, 0, 0, 0.1); border-radius: 50%; margin-top: 15px; animation: shadowPulse 1.2s ease-in-out infinite; }
        @keyframes kineticShoe { 0%, 100% { transform: translateY(0) rotate(-10deg); } 50% { transform: translateY(-30px) rotate(15deg); } }
        @keyframes shadowPulse { 0%, 100% { transform: scale(1); opacity: 0.4; } 50% { transform: scale(1.8); opacity: 0.1; } }
        .loader-text { margin-top: 30px; font-weight: 800; color: #1e293b; font-size: 12px; text-transform: uppercase; letter-spacing: 2px; animation: textFade 1.2s infinite; }
        @keyframes textFade { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }

        /* --- UI Components --- */
        #main-header { width: 100%; z-index: 9999; position: relative; display: none; }
        .header-container { width: 100%; max-width: 600px; margin: 0 auto; display: flex; align-items: center; height: 100%; padding: 0 20px; }
        .header-floating { margin: 10px auto !important; border-radius: 20px !important; width: calc(100% - 30px) !important; max-width: 570px !important; overflow: hidden; }

        #hero-banner { margin: 20px auto; border-radius: 35px; overflow: hidden; position: relative; max-width: 600px; width: calc(100% - 40px); display: flex; align-items: center; }
        .banner-content { padding: 25px; width: 60%; z-index: 10; position: relative; }
        .banner-img { position: absolute; right: -15px; width: 50%; transform: rotate(-15deg); filter: drop-shadow(0 15px 25px rgba(0,0,0,0.4)); z-index: 5; pointer-events: none; }

        #bottom-nav { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: calc(100% - 40px); max-width: 500px; height: 70px; background: #000000; border-radius: 25px; display: flex; justify-content: space-around; align-items: center; z-index: 10000; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: #888888; text-decoration: none; transition: all 0.3s ease; cursor: pointer; position: relative; }
        .nav-item.active { color: #ffffff; }
        .nav-item i { font-size: 20px; margin-bottom: 4px; }
        .nav-item span { font-size: 10px; font-weight: 700; }
        .cart-badge { position: absolute; top: -5px; right: -8px; background: #ef4444; color: white; font-size: 9px; font-weight: 800; min-width: 16px; height: 16px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 2px solid #000; }

        .hidden { display: none; }
        .page-fade { animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* --- Updated Product Sheet Styles --- */
        #product-sheet { 
            position: fixed; bottom: 0; left: 0; right: 0; background: white; 
            border-top-left-radius: 40px; border-top-right-radius: 40px; padding: 25px; 
            max-height: 80vh; overflow-y: auto; transform: translateY(100%); 
            transition: transform 0.4s cubic-bezier(0.165, 0.84, 0.44, 1); z-index: 20001; 
            box-shadow: 0 -10px 40px rgba(0,0,0,0.1);
            padding-bottom: calc(30px + env(safe-area-inset-bottom));
        }
        #product-sheet::before { content: ""; display: block; width: 40px; height: 5px; background: #e2e8f0; border-radius: 10px; margin: -10px auto 15px auto; }
        #product-sheet-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); backdrop-filter: blur(4px); z-index: 20000; transition: opacity 0.3s; opacity: 0; }
        .sheet-close-btn { position: absolute; top: 20px; left: 20px; width: 36px; height: 36px; background: #f1f5f9; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #1e293b; cursor: pointer; border: none; z-index: 20002; }

        /* --- Grid & Badges --- */
        .badge { position: absolute; top: 12px; left: 12px; padding: 4px 10px; border-radius: 10px; font-size: 9px; font-weight: 900; text-transform: uppercase; z-index: 10; }
        .badge-sale { background: #ef4444; color: white; }
        .badge-hot { background: #f59e0b; color: white; }
        .badge-new { background: #10b981; color: white; }
        
        .slider-container { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; border-radius: 35px; }
        .slider-item { min-width: 100%; scroll-snap-align: start; }
        .slider-item img { width: 100%; aspect-ratio: 1/1; object-fit: contain; }
        .options-scroll { display: flex; overflow-x: auto; gap: 8px; padding-bottom: 5px; scrollbar-width: none; }
        .option-btn { border: 2px solid #f1f5f9; transition: all 0.2s; flex: 0 0 auto; outline: none; -webkit-tap-highlight-color: transparent; }
        .option-btn.selected { border-color: #2563eb; background: #2563eb; color: white !important; }
        .stepper-ui { display: flex; align-items: center; background: #f1f5f9; border-radius: 12px; padding: 3px; }
        .stepper-btn { width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; background: white; border-radius: 9px; cursor: pointer; }
        .stepper-count { padding: 0 10px; font-weight: 800; font-size: 13px; min-width: 25px; text-align: center; }
    </style>
</head>
<body class="bg-[#f8f9fc]">
    <div id="app-preloader">
        <div class="loader-container">
            <div class="shoe-icon"><i class="fa-solid fa-shoe-prints"></i></div>
            <div class="shoe-shadow"></div>
        </div>
        <p class="loader-text">არჩევთ საუკეთესოს...</p>
    </div>

    <header id="main-header" class="flex items-center"></header>

    <div id="home-page" class="page-fade">
        <div id="hero-banner"></div>
        <div id="product-grid" class="grid grid-cols-2 gap-4 px-6 mt-4"></div>
    </div>

    <div id="cart-page" class="hidden page-fade px-6 pt-6">
        <h2 class="text-2xl font-black mb-6">კალათა</h2>
        <div id="cart-items" class="space-y-4"></div>
        <div id="promo-section" class="mt-8">
            <div class="bg-white p-4 rounded-[25px] border border-slate-50">
                <div class="flex gap-2">
                    <input id="promo-input" type="text" placeholder="პრომო კოდი" class="flex-1 bg-slate-50 border-none rounded-xl px-4 text-sm font-bold">
                    <button onclick="applyPromo()" class="bg-black text-white px-6 py-3 rounded-xl font-bold text-xs">გამოყენება</button>
                </div>
                <div id="promo-msg"></div>
            </div>
        </div>
        <div id="cart-summary" class="mt-6 mb-32 bg-white p-6 rounded-[30px] shadow-sm">
            <div class="flex justify-between mb-4"><span class="text-slate-400 font-bold">ჯამი:</span><span id="cart-total-price" class="text-xl font-black text-blue-600">0₾</span></div>
            <button onclick="placeOrder()" class="w-full bg-slate-900 text-white py-5 rounded-[22px] font-black">გაფორმება</button>
        </div>
    </div>

    <div id="checkout-page" class="hidden page-fade px-6 pt-6 pb-20">
        <h2 class="text-2xl font-black mb-6">გაფორმება</h2>
        <div class="space-y-4">
            <input id="order-name" type="text" placeholder="სახელი გვარი *" class="w-full p-4 rounded-xl border border-slate-100 font-bold text-sm">
            <input id="order-phone" type="text" placeholder="ტელეფონი *" class="w-full p-4 rounded-xl border border-slate-100 font-bold text-sm">
            <input id="order-city" type="text" placeholder="ქალაქი *" class="w-full p-4 rounded-xl border border-slate-100 font-bold text-sm">
            <input id="order-address" type="text" placeholder="მისამართი *" class="w-full p-4 rounded-xl border border-slate-100 font-bold text-sm">
            <textarea id="order-extra" placeholder="დამატებითი ინფორმაცია" class="w-full p-4 rounded-xl border border-slate-100 font-bold text-sm h-24"></textarea>
            <div class="flex justify-between items-center py-4 border-t mt-4">
                <span class="font-bold text-slate-400">გადასახდელი:</span>
                <span id="checkout-total-price" class="text-2xl font-black text-blue-600">0₾</span>
            </div>
            <button onclick="confirmFinalOrder()" class="w-full bg-blue-600 text-white py-5 rounded-[22px] font-black">გადახდაზე გადასვლა</button>
        </div>
    </div>

    <div id="payment-page" class="hidden page-fade px-6 pt-6 pb-20 text-center">
        <h2 class="text-2xl font-black mb-2">გადახდის მეთოდი</h2>
        <p class="text-slate-400 font-bold text-xs mb-8">აირჩიეთ თქვენთვის მოსახერხებელი გზა</p>
        <div class="space-y-4">
            <div onclick="selectPayment('card', 'ბარათით გადახდა')" class="bg-white p-6 rounded-[25px] border border-slate-100 flex items-center justify-between cursor-pointer active:scale-95 transition-all">
                <div class="flex items-center gap-4"><i class="fa-solid fa-credit-card text-2xl text-blue-600"></i><span class="font-black text-slate-800">ბარათით</span></div>
                <i class="fa-solid fa-chevron-right text-slate-300"></i>
            </div>
            <div onclick="selectPayment('cash', 'კურიერთან ნაღდი ანგარიშსწორება')" class="bg-white p-6 rounded-[25px] border border-slate-100 flex items-center justify-between cursor-pointer active:scale-95 transition-all">
                <div class="flex items-center gap-4"><i class="fa-solid fa-truck text-2xl text-green-600"></i><span class="font-black text-slate-800">კურიერთან</span></div>
                <i class="fa-solid fa-chevron-right text-slate-300"></i>
            </div>
        </div>
        <div class="mt-10 text-slate-400 font-bold">ჯამური თანხა: <span id="payment-final-total" class="text-slate-900">0₾</span></div>
    </div>

    <div id="orders-page" class="hidden page-fade px-6 pt-6 pb-20">
        <h2 class="text-2xl font-black mb-6">ჩემი შეკვეთები</h2>
        <div id="orders-list" class="space-y-4"></div>
    </div>

    <div id="profile-page" class="hidden page-fade"></div>

    <div id="product-details-page" class="hidden fixed inset-0 bg-white z-[30000] overflow-y-auto"></div>

    <div id="product-sheet-overlay" class="hidden" onclick="closeProductSheet()"></div>
    <div id="product-sheet">
        <button onclick="closeProductSheet()" class="sheet-close-btn"><i class="fa-solid fa-xmark"></i></button>
        <div id="sheet-content"></div>
    </div>
    
    <nav id="bottom-nav"></nav>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbzlFXWDikCWQFa1FhMMbN0DtaKArKyK6-NoJqN0zK3k4gDsSPz6YK57Hd_B63bOyofPMg/exec";
        const PROMO_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQH2mZB4PnZn6hJJRPgC_Ry0HTt7BvKiNmcNGyx7PVOMHY0rNFqhM4MneVoRI3kT00y6vxMMOoHbipA/pub?output=csv";
        
        let storeData = null;
        let cart = JSON.parse(localStorage.getItem('cart')) || [];
        let activeDiscountData = null;
        
        async function init() {
            if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.ready();
                window.Telegram.WebApp.expand();
            }
            try {
                const res = await fetch(API_URL);
                storeData = await res.json();
                
                if (storeData.header) renderHeader(storeData.header);
                if (storeData.banner) renderBanner(storeData.banner);
                if (storeData.latest) renderProducts(storeData.latest);
                if (storeData.navigation) renderNavigation(storeData.navigation);
                if (storeData.profileMenu) renderProfile(storeData.profileMenu);
                
                updateCartBadge();
                const preloader = document.getElementById('app-preloader');
                preloader.style.opacity = '0';
                setTimeout(() => preloader.style.display = 'none', 500);
            } catch (e) { console.error("Error:", e); }
        }

        function renderHeader(h) {
            const el = document.getElementById('main-header');
            if (h.status !== 'active') return;
            el.style.display = 'flex';
            el.style.backgroundColor = h.bg || "#24afeb";
            el.style.height = (parseInt(h.height) || 80) + "px";
            el.style.color = h.textColor || "#ffffff";
            if (h.style === 'floating') el.classList.add('header-floating');
            el.innerHTML = `
                <div class="header-container" style="justify-content: ${h.layout === 'center' ? 'center' : 'space-between'}">
                    <div class="flex items-center gap-3">
                        <img src="${h.logo}" style="width: 45px; border-radius: ${h.logoRadius}%">
                        <span style="font-weight: 800; font-size: 18px">${h.name || ''}</span>
                    </div>
                </div>`;
        }

        function renderBanner(b) {
            const el = document.getElementById('hero-banner');
            el.style.height = (parseInt(b.height) || 180) + "px";
            el.style.background = b.gradient === "1" ? "linear-gradient(135deg, #1e293b 0%, #334155 100%)" : "#1e293b";
            el.innerHTML = `
                <div class="banner-content">
                    <h2 style="font-size: ${parseInt(b.titleSize)}px; color: white; font-weight: 900; line-height: 1.1;">${b.title}</h2>
                    <p style="color: rgba(255,255,255,0.7); font-size: 10px; margin-top: 8px; font-weight: 700;">${b.subtitle || ''}</p>
                    <button class="mt-5 bg-white text-black px-6 py-2.5 rounded-2xl text-[10px] font-black uppercase">${b.btnText}</button>
                </div>
                <img src="${b.image}" class="banner-img">`;
        }

        function renderProducts(l) {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = l.items.map((p, index) => {
                const details = storeData.productDetails.find(d => d.id.toString() === p.id.toString());
                const statusBadge = details && details.status ? `<span class="badge badge-${details.status.toLowerCase()}">${details.status}</span>` : '';
                return `
                <div onclick="openProductSheet(${index})" class="bg-white p-4 rounded-[30px] border border-slate-100 shadow-sm active:scale-95 transition-all cursor-pointer relative overflow-hidden">
                    ${statusBadge}
                    <img src="${p.images.split(',')[0]}" class="h-24 mx-auto object-contain" onerror="this.src='https://placehold.co/200x200?text=Shoes'">
                    <h4 class="font-bold text-[11px] text-slate-700 truncate mt-3">${p.name}</h4>
                    <p class="text-blue-600 font-black text-sm mt-1">${p.price}₾</p>
                </div>`;
            }).join('');
        }

        function openProductSheet(index) {
            const p = storeData.latest.items[index];
            const overlay = document.getElementById('product-sheet-overlay');
            const sheet = document.getElementById('product-sheet');
            const content = document.getElementById('sheet-content');
            content.innerHTML = `
                <div class="flex flex-col items-center">
                    <div class="w-full h-40 bg-slate-50 rounded-[25px] flex items-center justify-center mb-4 overflow-hidden">
                        <img src="${p.images.split(',')[0]}" class="h-full object-contain p-2">
                    </div>
                    <h3 class="text-lg font-black text-slate-800 text-center leading-tight px-2">${p.name}</h3>
                    <p class="text-xl font-black text-blue-600 mt-1">${p.price}₾</p>
                    <button onclick="goToProductDetails('${p.id}')" class="w-full mt-6 bg-slate-900 text-white py-4 rounded-[20px] font-black text-sm active:scale-95 transition-all shadow-lg flex items-center justify-center gap-2">
                        დეტალურად ნახვა <i class="fa-solid fa-arrow-right text-[10px]"></i>
                    </button>
                </div>`;
            overlay.classList.remove('hidden');
            setTimeout(() => { overlay.style.opacity = "1"; sheet.style.transform = "translateY(0)"; }, 10);
        }

        function closeProductSheet() {
            const overlay = document.getElementById('product-sheet-overlay');
            const sheet = document.getElementById('product-sheet');
            sheet.style.transform = "translateY(100%)";
            overlay.style.opacity = "0";
            setTimeout(() => overlay.classList.add('hidden'), 300);
        }

        function goToProductDetails(id) {
            closeProductSheet();
            const details = storeData.productDetails.find(d => d.id.toString() === id.toString());
            const page = document.getElementById('product-details-page');
            if (!details) return;
            const images = details.fullImages ? details.fullImages.split(',') : [details.images];
            const sizes = details.sizes ? details.sizes.toString().split(',') : [];
            const colors = details.colors ? details.colors.toString().split(',') : [];
            page.innerHTML = `
                <div class="px-6 pt-4 pb-32">
                    <button onclick="closeProductDetails()" class="mb-6 flex items-center gap-2 text-slate-500 font-black text-xs uppercase"><i class="fa-solid fa-arrow-left"></i> უკან</button>
                    <div class="relative mb-6">
                        <div class="slider-container shadow-sm bg-white">
                            ${images.map(img => `<div class="slider-item"><img src="${img.trim()}" class="w-full h-auto aspect-square object-contain"></div>`).join('')}
                        </div>
                    </div>
                    <div class="flex justify-between items-start mb-6 gap-4">
                        <div class="flex-1"><h1 class="text-2xl font-black text-slate-800 leading-tight">${details.name}</h1><span class="text-[10px] font-bold text-slate-400">ID: ${details.id}</span></div>
                        <div class="text-right"><span class="text-2xl font-black text-blue-600">${details.price}₾</span></div>
                    </div>
                    <div class="mb-8"><h4 class="text-[10px] font-black text-slate-400 uppercase mb-2">აღწერა</h4><p class="text-slate-600 text-sm leading-relaxed">${details.description || 'აღწერა არ არის'}</p></div>
                    <div class="mb-6"><h4 class="text-[10px] font-black text-slate-400 uppercase mb-3">აირჩიე ზომა</h4><div class="options-scroll">${sizes.map(s => `<button onclick="selectOption(this, 'size', '${details.id}')" class="option-btn size-opt px-5 py-3 rounded-2xl font-bold text-slate-700 text-sm bg-white border border-slate-100">${s.trim()}</button>`).join('')}</div></div>
                    <div class="mb-6"><h4 class="text-[10px] font-black text-slate-400 uppercase mb-3">აირჩიე ფერი</h4><div class="options-scroll">${colors.map(c => `<button onclick="selectOption(this, 'color', '${details.id}')" class="option-btn color-opt px-5 py-3 rounded-2xl font-bold text-slate-700 text-sm bg-white border border-slate-100">${c.trim()}</button>`).join('')}</div></div>
                </div>
                <div class="fixed bottom-6 left-0 right-0 px-6 z-50"><button id="dynamic-buy-btn" disabled class="w-full bg-slate-300 text-white py-5 rounded-[25px] font-black text-lg shadow-xl transition-all">აირჩიე ზომა</button></div>`;
            document.getElementById('home-page').classList.add('hidden');
            document.getElementById('main-header').classList.add('hidden');
            page.classList.remove('hidden');
            window.scrollTo(0, 0);
        }

        function closeProductDetails() {
            document.getElementById('product-details-page').classList.add('hidden');
            document.getElementById('home-page').classList.remove('hidden');
            document.getElementById('main-header').classList.remove('hidden');
            window.scrollTo(0, 0);
        }

        function selectOption(btn, type, productId) {
            const parentClass = type === 'size' ? '.size-opt' : '.color-opt';
            document.querySelectorAll(parentClass).forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            const hasSize = document.querySelector('.size-opt.selected');
            const hasColor = document.querySelector('.color-opt.selected');
            const buyBtn = document.getElementById('dynamic-buy-btn');
            if (!hasSize) { buyBtn.innerText = "აირჩიე ზომა"; buyBtn.disabled = true; buyBtn.className = "w-full bg-slate-300 text-white py-5 rounded-[25px] font-black text-lg cursor-not-allowed transition-all"; }
            else if (!hasColor) { buyBtn.innerText = "აირჩიე ფერი"; buyBtn.disabled = true; buyBtn.className = "w-full bg-blue-600 text-white py-5 rounded-[25px] font-black text-lg transition-all"; }
            else { buyBtn.innerText = "კალათაში დამატება"; buyBtn.disabled = false; buyBtn.className = "w-full bg-blue-600 text-white py-5 rounded-[25px] font-black text-lg shadow-2xl active:scale-95 transition-all cursor-pointer"; buyBtn.onclick = () => handleBuy(productId); }
        }

        function handleBuy(id) {
            const sizeEl = document.querySelector('.size-opt.selected');
            const colorEl = document.querySelector('.color-opt.selected');
            const product = storeData.productDetails.find(d => d.id.toString() === id.toString());
            const cartItem = { cartId: Date.now(), id: product.id.toString(), name: product.name, price: parseFloat(product.price) || 0, size: sizeEl.innerText, color: colorEl.innerText, image: (product.images || "").split(',')[0] };
            cart.push(cartItem);
            localStorage.setItem('cart', JSON.stringify(cart));
            updateCartBadge();
            const buyBtn = document.getElementById('dynamic-buy-btn');
            buyBtn.innerText = "✅ დაემატა კალათაში";
            buyBtn.classList.replace('bg-blue-600', 'bg-green-600');
            setTimeout(() => closeProductDetails(), 800);
        }

        function renderCart() {
            const el = document.getElementById('cart-items');
            const summary = document.getElementById('cart-summary');
            const promoSection = document.getElementById('promo-section');
            const totalEl = document.getElementById('cart-total-price');
            if (cart.length === 0) { el.innerHTML = `<div class="text-center py-20 text-slate-400 font-bold italic">კალათა ცარიელია</div>`; summary.classList.add('hidden'); promoSection.classList.add('hidden'); return; }
            summary.classList.remove('hidden');
            promoSection.classList.remove('hidden');
            const grouped = cart.reduce((acc, item) => { const key = `${item.id}-${item.size}-${item.color}`; if (!acc[key]) acc[key] = { ...item, quantity: 1 }; else acc[key].quantity += 1; return acc; }, {});
            let subtotal = 0;
            el.innerHTML = Object.values(grouped).map(item => {
                const price = parseFloat(item.price) || 0;
                subtotal += price * item.quantity;
                return `<div class="bg-white p-4 rounded-[25px] border border-slate-50 flex items-center gap-4">
                    <img src="${item.image}" class="w-16 h-16 object-contain bg-slate-50 rounded-xl">
                    <div class="flex-1 min-w-0">
                        <h4 class="font-bold text-slate-800 text-xs truncate">${item.name}</h4>
                        <p class="text-[10px] text-slate-400 font-bold">${item.size} / ${item.color}</p>
                        <div class="flex items-center justify-between mt-2"><p class="text-blue-600 font-black text-sm">${price}₾</p>
                        <div class="stepper-ui">
                            <div onclick="updateQuantity('${item.id}', '${item.size}', '${item.color}', -1)" class="stepper-btn"><i class="fa-solid fa-minus text-[10px]"></i></div>
                            <span class="stepper-count">${item.quantity}</span>
                            <div onclick="updateQuantity('${item.id}', '${item.size}', '${item.color}', 1)" class="stepper-btn !bg-slate-900 !text-white"><i class="fa-solid fa-plus text-[10px]"></i></div>
                        </div></div>
                    </div>
                </div>`;
            }).join('');
            let finalTotal = subtotal;
            if (activeDiscountData) { if (activeDiscountData.type === 'percent') finalTotal = subtotal * (1 - activeDiscountData.value / 100); else if (activeDiscountData.type === 'flat') finalTotal = subtotal - activeDiscountData.value; }
            totalEl.innerText = Math.round(finalTotal > 0 ? finalTotal : 0) + "₾";
        }

        async function applyPromo() {
            const input = document.getElementById('promo-input');
            const msg = document.getElementById('promo-msg');
            const code = input.value.trim().toUpperCase();
            if (!code) return;
            msg.innerText = "მოწმდება...";
            try {
                const response = await fetch(PROMO_CSV_URL);
                const csvText = await response.text();
                const rows = csvText.replace(/\r/g, "").split('\n');
                const promoCodes = rows.slice(1).filter(r => r.trim() !== "").map(row => { const cols = row.split(','); return { code: cols[0]?.trim().toUpperCase(), type: cols[1]?.trim().toLowerCase(), value: parseFloat(cols[2]) }; });
                const promo = promoCodes.find(p => p.code === code);
                if (promo && !isNaN(promo.value)) { activeDiscountData = promo; msg.className = "text-[10px] font-bold mt-2 text-green-600"; msg.innerText = `გააქტიურდა: ${promo.type === 'percent' ? '-' + promo.value + '%' : '-' + promo.value + '₾'}`; }
                else { activeDiscountData = null; msg.className = "text-[10px] font-bold mt-2 text-red-500"; msg.innerText = "არასწორი კოდი"; }
                renderCart();
            } catch (e) { msg.innerText = "შეცდომაა"; }
        }

        function updateQuantity(id, size, color, change) {
            const idx = cart.findIndex(i => String(i.id) === String(id) && String(i.size) === String(size) && String(i.color) === String(color));
            if (idx > -1) { if (change === 1) cart.push({ ...cart[idx], cartId: Date.now() }); else cart.splice(idx, 1); localStorage.setItem('cart', JSON.stringify(cart)); updateCartBadge(); renderCart(); }
        }

        function updateCartBadge() {
            const badge = document.getElementById('cart-count-badge');
            if (!badge) return;
            if (cart.length > 0) { badge.innerText = cart.length; badge.classList.remove('hidden'); }
            else badge.classList.add('hidden');
        }

        function renderNavigation(items) {
            const nav = document.getElementById('bottom-nav');
            nav.innerHTML = items.map((item, index) => `<div onclick="switchPage('${item.action}', this)" class="nav-item ${index === 0 ? 'active' : ''}"><div class="relative"><i class="fa-solid ${item.icon}"></i>${item.action === 'cart' ? `<div id="cart-count-badge" class="cart-badge hidden">0</div>` : ''}</div><span>${item.name}</span></div>`).join('');
            updateCartBadge();
        }

        function renderProfile(menu) {
            const el = document.getElementById('profile-page');
            const user = window.Telegram?.WebApp?.initDataUnsafe?.user || { first_name: "სტუმარი", id: "000000" };
            const photo = user.photo_url || `https://ui-avatars.com/api/?name=${encodeURIComponent(user.first_name)}`;
            el.innerHTML = `<div class="flex items-center gap-4 p-6"><img src="${photo}" class="w-16 h-16 rounded-full border-4 border-white shadow-lg"><div><h2 class="text-lg font-black text-slate-800">${user.first_name}</h2><p class="text-slate-400 text-[10px] font-bold">ID: ${user.id}</p></div></div>
                <div class="px-6 space-y-2">${menu.map(m => `<div onclick="switchPage('${m.action}', this)" class="bg-white p-3.5 rounded-[22px] flex items-center justify-between border border-slate-50 active:scale-95 transition-all"><div class="flex items-center gap-3"><div class="w-9 h-9 bg-slate-50 rounded-xl flex items-center justify-center text-slate-500"><i class="fa-solid ${m.icon}"></i></div><span class="font-bold text-slate-700 text-sm">${m.label}</span></div><i class="fa-solid fa-chevron-right text-slate-300 text-[10px]"></i></div>`).join('')}</div>`;
        }

        function switchPage(action, btn) {
            const pages = { home: 'home-page', profile: 'profile-page', orders: 'orders-page', cart: 'cart-page', checkout: 'checkout-page', payment: 'payment-page' };
            Object.values(pages).forEach(p => { const el = document.getElementById(p); if(el) el.classList.add('hidden'); });
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            if (pages[action]) document.getElementById(pages[action]).classList.remove('hidden');
            if (action === 'home') document.getElementById('main-header').classList.remove('hidden'); else document.getElementById('main-header').classList.add('hidden');
            if (action === 'cart') renderCart();
            window.scrollTo(0, 0);
        }

        async function selectPayment(methodId, methodTitle) {
            const name = document.getElementById('order-name').value.trim();
            const phone = document.getElementById('order-phone').value.trim();
            const city = document.getElementById('order-city').value.trim();
            const address = document.getElementById('order-address').value.trim();
            const total = document.getElementById('checkout-total-price').innerText.replace('₾', '').trim();
            const itemsSummary = cart.map(i => `${i.name} (${i.size}, ${i.color})`).join(', ');
            const tg = window.Telegram.WebApp;
            const finalParams = new URLSearchParams({ action: "placeOrder", userId: (tg.initDataUnsafe?.user?.id || "000000").toString(), customerName: name, phone: phone, address: `${city}, ${address} [${methodTitle}]`, items: itemsSummary, total: total, promo: activeDiscountData ? activeDiscountData.code : "არა" });
            try {
                fetch(`${API_URL}?${finalParams.toString()}`, { mode: 'no-cors' });
                localStorage.removeItem('cart'); cart = []; updateCartBadge();
                alert("შეკვეთა მიღებულია!"); tg.close();
            } catch (e) { alert("შეცდომაა"); }
        }

        function placeOrder() { if (cart.length === 0) return; switchPage('checkout'); document.getElementById('checkout-total-price').innerText = document.getElementById('cart-total-price').innerText; }
        function confirmFinalOrder() { 
            if (!document.getElementById('order-name').value || !document.getElementById('order-phone').value) { alert("შეავსეთ ველები"); return; }
            document.getElementById('payment-final-total').innerText = document.getElementById('checkout-total-price').innerText;
            switchPage('payment'); 
        }

        init();
    </script>
</body>
</html>
