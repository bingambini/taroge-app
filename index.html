<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ShoeShop - Premium Store</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <script>
        (function() {
            const tg = window.Telegram.WebApp;
            tg.ready();
            tg.expand();
            setTimeout(() => {
                tg.expand();
            }, 150);
        })();
    </script>
    
    <style>
        #loader-wrapper {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        .shoe-animation {
            font-size: 60px;
            animation: initialBounce 0.6s ease-in-out infinite alternate;
        }

        @keyframes initialBounce {
            from { transform: translateY(0); }
            to { transform: translateY(-20px); }
        }

        .loading-text {
            color: white;
            margin-top: 15px;
            font-family: -apple-system, system-ui, sans-serif;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 1px;
        }

        .progress-bar {
            width: 150px;
            height: 4px;
            background: rgba(255,255,255,0.2);
            border-radius: 10px;
            margin-top: 25px;
            overflow: hidden;
        }

        .progress-line {
            width: 100%;
            height: 100%;
            background: #ffffff;
            animation: initialProgress 1.5s infinite;
        }

        @keyframes initialProgress {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .loader-hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        /* საკონტაქტო მენიუს სტილები */
        #contact-modal {
            position: fixed;
            top: -65%;
            left: 0;
            width: 100%;
            height: 55%;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 9000;
            transition: top 0.5s cubic-bezier(0.3, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
            padding: 20px 20px 10px 20px;
            box-sizing: border-box;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            border-radius: 0 0 30px 30px;
        }

        #modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.15);
            z-index: 8999;
        }
    </style>

    <link rel="stylesheet" href="style.css?v=7.0">
</head>
<body>

    <div id="loader-wrapper">
        <div class="loader-content" style="text-align: center;">
            <div class="shoe-animation">👟</div>
            <div class="loading-text">ჩატვირთვა...</div>
            <div class="progress-bar">
                <div class="progress-line"></div>
            </div>
        </div>
    </div>

    <div id="modal-overlay" onclick="toggleContactModal()"></div>
    <div id="contact-modal">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h3 style="font-size: 20px; font-weight: 700; color: #1d1d1f; margin: 0;">კონტაქტი</h3>
            <div onclick="toggleContactModal()" style="width: 30px; height: 30px; background: #e5e5ea; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer;">
                <span style="font-size: 16px; font-weight: 600; color: #1d1d1f;">✕</span>
            </div>
        </div>
        <div id="contact-list" style="display: flex; flex-direction: column; gap: 10px; overflow-y: auto;">
            </div>
        <div style="width: 40px; height: 4px; background: #d2d2d7; border-radius: 10px; margin: 15px auto 0;"></div>
    </div>
    
    <header class="header">
        <div class="container header-grid">
            <div class="header-left">
                <div id="logo-icon" class="logo-circle">B</div> 
            </div>

            <div class="header-center">
                <div id="logo" class="logo">გიო</div>
            </div>

            <div class="header-right" id="info-btn-container" style="width: 40px; display: flex; justify-content: flex-end;">
                </div>
        </div>
    </header>

    <main class="container" id="main-content">
        <section id="hero" class="hero-section" style="display: none;"></section>

        <section id="content-section" class="section">
            <h2 id="new-arrivals-title" class="section-title">ახალი კოლექცია</h2>
            <div id="products-grid" class="products-grid"></div>
        </section>
    </main>

    <nav class="bottom-nav">
        <div class="nav-item active" onclick="handleNavChange('home', this)">
            <div class="nav-icon">
                <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2.5" fill="none">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                </svg>
            </div>
            <span>მთავარი</span>
        </div>
        
        <div class="nav-item" onclick="handleNavChange('categories', this)">
            <div class="nav-icon">
                <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2.5" fill="none">
                    <rect x="3" y="3" width="7" height="7"></rect>
                    <rect x="14" y="3" width="7" height="7"></rect>
                    <rect x="14" y="14" width="7" height="7"></rect>
                    <rect x="3" y="14" width="7" height="7"></rect>
                </svg>
            </div>
            <span>კატეგორია</span>
        </div>

        <div class="nav-item" onclick="handleNavChange('cart', this)">
            <div class="nav-icon cart-wrapper">
                <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2.5" fill="none">
                    <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"></path>
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <path d="M16 10a4 4 0 0 1-8 0"></path>
                </svg>
                <span id="nav-cart-badge" class="nav-badge" style="display: none;">0</span>
            </div>
            <span>კალათა</span>
        </div>

        <div class="nav-item" onclick="handleNavChange('profile', this)">
            <div class="nav-icon">
                <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2.5" fill="none">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg>
            </div>
            <span>პროფილი</span>
        </div>
    </nav>

    <script src="script.js?v=3.7"></script>
</body>
</html>
