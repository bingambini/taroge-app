<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shoes Store - Final</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8f9fc; margin: 0; padding-bottom: 120px; }
        
        #main-header { width: 100%; z-index: 9999; position: relative; transition: all 0.3s ease; display: none; }
        .header-floating { margin: 10px 15px !important; border-radius: 20px !important; width: calc(100% - 30px) !important; overflow: hidden; }
        
        #hero-banner { margin: 20px; border-radius: 35px; overflow: hidden; min-height: 100px; background: #f1f5f9; position: relative; }
    </style>
</head>
<body>

    <header id="main-header" class="flex items-center"></header>
    <div id="hero-banner"></div>
    <div id="product-grid" class="grid grid-cols-2 gap-4 px-6"></div>

    <script>
        // შენი ახალი API ლინკი
        const API_URL = "https://script.google.com/macros/s/AKfycbxcFkep42wZOBQDWuzgdbh2txh3LSlFx_rQzz702UHtHpS0MPqEyxsIrOB5-A_eVe03PQ/exec";

        async function init() {
            try {
                const res = await fetch(API_URL);
                const data = await res.json();
                console.log("Data Received:", data);
                
                if (data.header) renderHeader(data.header);
                if (data.banner) renderBanner(data.banner);
                if (data.latest) renderProducts(data.latest);
            } catch (e) {
                console.error("Error loading data:", e);
            }
        }

        function renderHeader(h) {
            const el = document.getElementById('main-header');
            if (h.status !== 'active') return;

            // ზომების მიღება შიტიდან
            const lSize = parseInt(h.logoSize) || 50; 
            const lRadius = parseInt(h.logoRadius) || 0;
            const hHeight = parseInt(h.height) || 80;

            el.style.display = 'flex';
            el.style.backgroundColor = h.bg || "#24afeb";
            el.style.height = hHeight + "px";
            el.style.color = h.textColor || "#ffffff";
            el.style.padding = "0 20px";
            el.style.justifyContent = h.layout === 'center' ? 'center' : 'space-between';

            if (h.style === 'floating') el.classList.add('header-floating');

            el.innerHTML = `
                <div class="flex items-center gap-3">
                    <img src="${h.logo}" style="width: ${lSize}px !important; height: auto; border-radius: ${lRadius}%" class="object-contain">
                    <span style="font-weight: 800; font-size: 18px;">${h.name || ''}</span>
                </div>
                ${h.layout !== 'center' ? '<i class="fa-solid fa-bell text-xl"></i>' : ''}
            `;
        }

        function renderBanner(b) {
            const el = document.getElementById('hero-banner');
            el.style.height = (parseInt(b.height) || 180) + "px";
            el.style.background = "#1e293b";
            el.innerHTML = `
                <div class="p-8 w-1/2 text-white relative z-10">
                    <h2 class="font-black text-xl leading-tight">${b.title}</h2>
                    <button class="mt-3 bg-white text-black px-5 py-2 rounded-xl text-[10px] font-extrabold uppercase">${b.btnText}</button>
                </div>
                <img src="${b.image}" class="absolute -right-5 w-44 rotate-[-15deg] drop-shadow-2xl z-0">
            `;
        }

        function renderProducts(l) {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = l.items.map(p => `
                <div class="bg-white p-4 rounded-[30px] border border-slate-100 shadow-sm">
                    <img src="${p.images.split(',')[0]}" class="h-28 mx-auto object-contain">
                    <h4 class="font-bold text-[11px] text-slate-700 truncate mt-2">${p.name}</h4>
                    <p class="text-blue-600 font-black text-sm">${p.price}₾</p>
                </div>
            `).join('');
        }

        init();
    </script>
</body>
</html>
