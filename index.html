<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shoes Store 2.6</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-[#f8f9fc]">

    <div id="app-preloader" class="fixed inset-0 bg-white z-[50000] flex flex-col items-center justify-center">
        <div class="loader-spin w-12 h-12 border-4 border-blue-600 border-t-transparent rounded-full animate-spin"></div>
        <p class="mt-4 font-black text-slate-800">იტვირთება...</p>
    </div>

    <header id="main-header" class="sticky top-0 z-[1000] transition-all"></header>

    <main id="app-content" class="pb-24">
        
        <div id="main-page" class="page-fade">
            <div id="hero-banner" class="px-5"></div>
            <div id="product-grid" class="grid grid-cols-2 gap-4 px-5 mt-6"></div>
        </div>

        <div id="details-page" class="hidden page-fade bg-white">
            </div>

        <div id="cart-page" class="hidden page-fade min-h-screen">
            </div>

        <div id="checkout-page" class="hidden page-fade px-6 pt-6 pb-20">
            <h2 class="text-xl font-black mb-6 text-slate-800">მიწოდების მონაცემები</h2>
            <div class="space-y-4">
                <input type="text" id="order-name" class="w-full p-4 bg-white border border-slate-200 rounded-2xl outline-none focus:border-blue-600 transition-all font-bold" placeholder="სახელი და გვარი *">
                <input type="tel" id="order-phone" class="w-full p-4 bg-white border border-slate-200 rounded-2xl outline-none focus:border-blue-600 transition-all font-bold" placeholder="ტელეფონი *">
                <input type="text" id="order-address" class="w-full p-4 bg-white border border-slate-200 rounded-2xl outline-none focus:border-blue-600 transition-all font-bold" placeholder="მისამართი *">
                <button onclick="placeOrder()" class="w-full bg-blue-600 text-white py-5 rounded-[25px] font-black mt-4 shadow-lg active:scale-95 transition-all">დადასტურება</button>
            </div>
        </div>

    </main>

    <nav id="bottom-nav" class="fixed bottom-0 left-0 right-0 bg-white/80 backdrop-blur-md border-t border-slate-100 flex justify-around items-center px-4 py-3 z-[10000]"></nav>

    <script src="script.js?v=2.7"></script>
</body>
</html>
