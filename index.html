<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shoes Store - Optimized 2.6</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="app-preloader">
        <div class="loader-spin"></div>
        <p style="margin-top: 20px; font-weight: 800; color: #1e293b; font-size: 14px;">იტვირთება...</p>
    </div>

    <header id="main-header" class="flex items-center"></header>

    <div id="home-page" class="page-fade">
        <div id="hero-banner"></div>
        <div id="product-grid" class="grid grid-cols-2 gap-4 px-6 mt-4"></div>
    </div>

    <div id="cart-page" class="hidden page-fade px-6 pt-6">
        <h2 class="text-2xl font-black text-slate-800 mb-6">ჩემი კალათა</h2>
        <div id="cart-items" class="space-y-4"></div>
        
        <div id="promo-section" class="hidden">
            <div class="promo-box">
                <input type="text" id="promo-input" class="promo-input" placeholder="პრომო კოდი...">
                <button onclick="applyPromo()" class="promo-btn">გამოყენება</button>
            </div>
            <p id="promo-msg" class="text-[10px] font-bold mt-2 px-2"></p>
        </div>

        <div id="cart-summary" class="mt-8 border-t pt-6 hidden">
            <div class="flex justify-between items-center mb-6">
                <div>
                    <span class="text-slate-500 font-bold">ჯამი:</span>
                    <div id="discount-label" class="text-[10px] text-green-600 font-black hidden">ფასდაკლება აქტიურია</div>
                </div>
                <span id="cart-total-price" class="text-2xl font-black text-blue-600">0₾</span>
            </div>
            <button onclick="placeOrder()" class="w-full bg-slate-900 text-white py-5 rounded-[25px] font-black text-lg active:scale-95 transition-all shadow-xl">
                შეკვეთის გაფორმება
            </button>
        </div>
    </div>

    <div id="checkout-page" class="hidden page-fade px-6 pt-6 pb-20">
        <div class="flex items-center gap-3 mb-6">
            <button onclick="switchPage('cart')" class="w-10 h-10 bg-white rounded-full flex items-center justify-center shadow-sm active:scale-90 transition-all">
                <i class="fa-solid fa-chevron-left text-slate-400"></i>
            </button>
            <h2 class="text-xl font-black text-slate-800">მიწოდების მონაცემები</h2>
        </div>

        <div class="space-y-4">
            <div class="input-group">
                <label>სახელი და გვარი *</label>
                <input type="text" id="order-name" class="checkout-input" placeholder="მაგ: გიორგი ბერიძე">
            </div>
            <div class="input-group">
                <label>ტელეფონის ნომერი *</label>
                <input type="tel" id="order-phone" class="checkout-input" placeholder="მაგ: 5XX XX XX XX">
            </div>
            <div class="grid grid-cols-2 gap-3">
                <div class="input-group">
                    <label>ქალაქი *</label>
                    <input type="text" id="order-city" class="checkout-input" placeholder="თბილისი">
                </div>
                <div class="input-group">
                    <label>მისამართი *</label>
                    <input type="text" id="order-address" class="checkout-input" placeholder="ქუჩა, კორპუსი">
                </div>
            </div>
            <div class="input-group">
                <label>დამატებითი შენიშვნა</label>
                <textarea id="order-extra" class="checkout-input h-24 pt-3" placeholder="მაგ: კოდი, სართული..."></textarea>
            </div>
        </div>

        <div class="mt-8 border-t pt-6">
            <div class="flex justify-between items-center mb-6">
                <span class="text-slate-500 font-bold uppercase text-xs">გადასახდელი ჯამი:</span>
                <span id="checkout-total-price" class="text-2xl font-black text-blue-600">0₾</span>
            </div>
            <button onclick="confirmFinalOrder()" class="w-full bg-blue-600 text-white py-5 rounded-[25px] font-black text-lg active:scale-95 transition-all shadow-xl shadow-blue-100">
                შეკვეთის დადასტურება
            </button>
        </div>
    </div>

    <div id="payment-page" class="hidden page-fade px-6 pt-6 pb-20">
        <div class="flex items-center gap-3 mb-6">
            <button onclick="switchPage('checkout')" class="w-10 h-10 bg-white rounded-full flex items-center justify-center shadow-sm active:scale-90 transition-all">
                <i class="fa-solid fa-chevron-left text-slate-400"></i>
            </button>
            <h2 class="text-xl font-black text-slate-800">გადახდის მეთოდი</h2>
        </div>

        <div class="space-y-3">
            <div onclick="selectPayment('Cash', 'კურიერთან გადახდა')" class="bg-white p-5 rounded-[25px] border border-slate-50 flex items-center gap-4 active:scale-95 transition-all cursor-pointer shadow-sm">
                <div class="w-11 h-11 bg-blue-50 rounded-xl flex items-center justify-center text-blue-500 text-lg"><i class="fa-solid fa-truck-fast"></i></div>
                <div class="flex-1">
                    <h4 class="font-black text-slate-800 text-[13px]">კურიერთან გადახდა</h4>
                    <p class="text-[9px] font-bold text-slate-400 uppercase italic">ნაღდი ან ტერმინალი</p>
                </div>
                <i class="fa-solid fa-chevron-right text-slate-200 text-[10px]"></i>
            </div>

            <div onclick="selectPayment('Card', 'ბარათით გადახდა')" class="bg-white p-5 rounded-[25px] border border-slate-50 flex items-center gap-4 active:scale-95 transition-all cursor-pointer shadow-sm">
                <div class="w-11 h-11 bg-green-50 rounded-xl flex items-center justify-center text-green-500 text-lg"><i class="fa-solid fa-credit-card"></i></div>
                <div class="flex-1">
                    <h4 class="font-black text-slate-800 text-[13px]">ბარათით გადახდა</h4>
                    <p class="text-[9px] font-bold text-slate-400 uppercase italic">ონლაინ გადახდა</p>
                </div>
                <i class="fa-solid fa-chevron-right text-slate-200 text-[10px]"></i>
            </div>

            <div onclick="selectPayment('Transfer', 'თანხის გადარიცხვა')" class="bg-white p-5 rounded-[25px] border border-slate-50 flex items-center gap-4 active:scale-95 transition-all cursor-pointer shadow-sm">
                <div class="w-11 h-11 bg-purple-50 rounded-xl flex items-center justify-center text-purple-500 text-lg"><i class="fa-solid fa-building-columns"></i></div>
                <div class="flex-1">
                    <h4 class="font-black text-slate-800 text-[13px]">თანხის გადარიცხვა</h4>
                    <p class="text-[9px] font-bold text-slate-400 uppercase italic">საბანკო რეკვიზიტებზე</p>
                </div>
                <i class="fa-solid fa-chevron-right text-slate-200 text-[10px]"></i>
            </div>
        </div>

        <div class="mt-10 p-6 bg-slate-50 rounded-[30px] text-center border border-dashed border-slate-200">
            <span class="text-slate-400 font-bold uppercase text-[9px] tracking-widest block mb-1">გადასახდელი ჯამი</span>
            <span id="payment-final-total" class="text-3xl font-black text-blue-600">0₾</span>
        </div>
    </div>

    <div id="profile-page" class="hidden page-fade"></div>

    <div id="orders-page" class="hidden page-fade px-6 pt-6">
        <div class="flex items-center gap-3 mb-6">
            <button onclick="switchPage('home')" class="w-10 h-10 bg-white rounded-full flex items-center justify-center shadow-sm active:scale-90 transition-all">
                <i class="fa-solid fa-chevron-left text-slate-400"></i>
            </button>
            <h2 class="text-xl font-black text-slate-800">ჩემი შეკვეთები</h2>
        </div>
        <div id="orders-list" class="space-y-3"></div>
    </div>

    <div id="product-details-page" class="hidden fixed inset-0 bg-white z-[30000] overflow-y-auto pb-40">
        <div class="sticky top-0 bg-white/90 backdrop-blur-md z-10 flex justify-between items-center p-6">
            <button onclick="closeProductDetails()" class="w-12 h-12 bg-slate-50 rounded-full flex items-center justify-center active:scale-90">
                <i class="fa-solid fa-arrow-left text-slate-800"></i>
            </button>
            <h3 class="font-bold text-slate-800">პროდუქტი</h3>
            <div class="w-12"></div> 
        </div>
        <div id="details-content" class="px-6 page-fade"></div>
    </div>

    <div id="product-sheet-overlay" class="fixed inset-0 bg-black/60 z-[20000] hidden opacity-0" onclick="closeProductSheet()">
        <div id="product-sheet" class="absolute bottom-0 left-0 right-0 bg-white rounded-t-[40px] p-8 transform translate-y-full transition-transform duration-300" onclick="event.stopPropagation()">
            <div class="w-12 h-1.5 bg-slate-200 rounded-full mx-auto mb-8"></div>
            <div id="sheet-content"></div>
        </div>
    </div>
    
    <nav id="bottom-nav"></nav>

    <script src="script.js"></script>
</body>
</html>
