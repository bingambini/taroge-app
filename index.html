<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shoes Store Optimized v2.6</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8f9fc; margin: 0; padding-bottom: 120px; overflow-x: hidden; }
        #main-header { width: 100%; z-index: 9999; position: relative; display: none; }
        .header-container { width: 100%; max-width: 600px; margin: 0 auto; display: flex; align-items: center; height: 100%; padding: 0 20px; }
        .header-floating { margin: 10px auto !important; border-radius: 20px !important; width: calc(100% - 30px) !important; max-width: 570px !important; }
        #bottom-nav { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: calc(100% - 40px); max-width: 500px; height: 70px; background: #000; border-radius: 25px; display: flex; justify-content: space-around; align-items: center; z-index: 10000; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: #888; transition: 0.3s; cursor: pointer; }
        .nav-item.active { color: #fff; }
        .cart-badge { position: absolute; top: -5px; right: -8px; background: #ef4444; color: white; font-size: 9px; font-weight: 800; min-width: 16px; height: 16px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 2px solid #000; }
        .slider-container { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; }
        .slider-item { min-width: 100%; scroll-snap-align: start; }
        .option-btn.selected { border-color: #2563eb; background: #2563eb; color: white !important; }
        .stepper-ui { display: flex; align-items: center; background: #f1f5f9; border-radius: 12px; padding: 3px; }
        .stepper-btn { width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; background: white; border-radius: 9px; cursor: pointer; }
        .hidden { display: none; }
        .page-fade { animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <header id="main-header"></header>

    <div id="home-page" class="page-fade">
        <div id="hero-banner" class="mx-5 my-5 rounded-[35px] overflow-hidden relative flex items-center min-h-[180px]"></div>
        <div id="product-grid" class="grid grid-cols-2 gap-4 px-6 mt-4"></div>
    </div>

    <div id="cart-page" class="hidden page-fade px-6 pt-6">
        <h2 class="text-2xl font-black text-slate-800 mb-6">კალათა</h2>
        <div id="cart-items" class="space-y-4"></div>
        <div id="promo-section" class="hidden mt-6 bg-white p-4 rounded-[25px] border border-slate-100">
            <div class="flex gap-2">
                <input type="text" id="promo-input" class="flex-1 bg-slate-50 border-none rounded-xl px-4 text-sm font-bold outline-none" placeholder="პრომო კოდი">
                <button onclick="applyPromo()" class="bg-black text-white px-4 py-3 rounded-xl text-xs font-bold">გამოყენება</button>
            </div>
            <p id="promo-msg" class="text-[10px] mt-2 font-bold"></p>
        </div>
        <div id="cart-summary" class="mt-8 border-t pt-6 hidden">
            <div class="flex justify-between items-center mb-6">
                <span class="text-slate-500 font-bold">ჯამი:</span>
                <span id="cart-total-price" class="text-2xl font-black text-blue-600">0₾</span>
            </div>
            <button onclick="placeOrder()" class="w-full bg-slate-900 text-white py-5 rounded-[25px] font-black text-lg">შეკვეთის გაფორმება</button>
        </div>
    </div>

    <div id="checkout-page" class="hidden page-fade px-6 pt-6 pb-20">
        <h2 class="text-xl font-black mb-6">მონაცემები</h2>
        <div class="space-y-4">
            <input type="text" id="order-name" class="w-full p-4 rounded-2xl bg-white border border-slate-100 font-bold" placeholder="სახელი გვარი *">
            <input type="tel" id="order-phone" class="w-full p-4 rounded-2xl bg-white border border-slate-100 font-bold" placeholder="ტელეფონი *">
            <input type="text" id="order-city" class="w-full p-4 rounded-2xl bg-white border border-slate-100 font-bold" placeholder="ქალაქი *">
            <input type="text" id="order-address" class="w-full p-4 rounded-2xl bg-white border border-slate-100 font-bold" placeholder="მისამართი *">
            <textarea id="order-extra" class="w-full p-4 rounded-2xl bg-white border border-slate-100 font-bold" placeholder="შენიშვნა"></textarea>
        </div>
        <div class="mt-8">
            <div class="flex justify-between items-center mb-6">
                <span class="font-bold">გადასახდელი:</span>
                <span id="checkout-total-price" class="text-2xl font-black text-blue-600">0₾</span>
            </div>
            <button onclick="confirmFinalOrder()" class="w-full bg-blue-600 text-white py-5 rounded-[25px] font-black">გაგრძელება</button>
        </div>
    </div>

    <div id="payment-page" class="hidden page-fade px-6 pt-6 pb-20">
        <h2 class="text-xl font-black mb-6">გადახდა</h2>
        <div class="space-y-3" id="payment-methods-list"></div>
        <div class="mt-10 p-6 bg-slate-50 rounded-[30px] text-center border border-dashed">
            <span id="payment-final-total" class="text-3xl font-black text-blue-600">0₾</span>
        </div>
    </div>

    <div id="orders-page" class="hidden page-fade px-6 pt-6">
        <h2 class="text-xl font-black mb-6">შეკვეთები</h2>
        <div id="orders-list" class="space-y-3"></div>
    </div>

    <div id="profile-page" class="hidden page-fade"></div>

    <div id="product-details-page" class="hidden fixed inset-0 bg-white z-[30000] overflow-y-auto pb-40">
        <div class="sticky top-0 bg-white/90 backdrop-blur-md z-10 flex justify-between items-center p-6">
            <button onclick="closeProductDetails()" class="w-12 h-12 bg-slate-50 rounded-full flex items-center justify-center"><i class="fa-solid fa-arrow-left"></i></button>
            <h3 class="font-bold">პროდუქტი</h3>
            <div class="w-12"></div>
        </div>
        <div id="details-content" class="px-6 page-fade"></div>
    </div>

    <nav id="bottom-nav"></nav>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbwnpjMaHc_bs2b4aNLU60lStAsebby6K32ECbgv35WV_uBvmX3Uo3Q3PDkxB9bALCMPHQ/exec";
        let storeData = null;
        let cart = JSON.parse(localStorage.getItem('cart')) || [];
        let activeDiscountData = null;

        async function init() {
            if (window.Telegram?.WebApp) {
                window.Telegram.WebApp.ready();
                window.Telegram.WebApp.expand();
            }
            try {
                const res = await fetch(API_URL);
                storeData = await res.json();
                if (storeData.header) renderHeader(storeData.header);
                if (storeData.banner) renderBanner(storeData.banner);
                if (storeData.latest) renderProducts(storeData.latest);
                if (storeData.navigation) renderNavigation(storeData.navigation);
                if (storeData.profileMenu) renderProfile(storeData.profileMenu);
                updateCartBadge();
            } catch (e) { console.error("Init Error:", e); }
        }

        function renderHeader(h) {
            const el = document.getElementById('main-header');
            if (h.status !== 'active') return;
            el.style.display = 'block';
            el.innerHTML = `<div class="header-container ${h.style === 'floating' ? 'header-floating' : ''}" style="background:${h.bg}; height:${h.height}px; color:${h.textColor}">
                <div class="flex items-center gap-3"><img src="${h.logo}" style="width:40px; border-radius:${h.logoRadius}%"><b>${h.name}</b></div>
            </div>`;
        }

        function renderBanner(b) {
            const el = document.getElementById('hero-banner');
            el.style.background = b.gradient === "1" ? "linear-gradient(135deg, #1e293b, #334155)" : "#1e293b";
            el.innerHTML = `<div class="p-8 w-3/5 z-10"><h2 class="text-white font-black leading-tight" style="font-size:${b.titleSize}px">${b.title}</h2>
                <button class="mt-4 bg-white text-black px-6 py-2 rounded-xl text-[10px] font-black uppercase">${b.btnText}</button></div>
                <img src="${b.image}" class="absolute right-[-10px] w-1/2 rotate-[-15deg] drop-shadow-2xl">`;
        }

        function renderProducts(l) {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = l.items.map(p => `
                <div onclick="openProductDetails('${p.id}')" class="bg-white p-4 rounded-[30px] border border-slate-50 shadow-sm active:scale-95 transition-all">
                    <img src="${p.images.split(',')[0]}" class="h-24 mx-auto object-contain">
                    <h4 class="font-bold text-[11px] mt-3 truncate">${p.name}</h4>
                    <p class="text-blue-600 font-black text-sm">${p.price}₾</p>
                </div>`).join('');
        }

        function openProductDetails(id) {
            const d = storeData.productDetails.find(p => p.id.toString() === id.toString());
            window.activeProductId = id;
            const imgs = d.fullImages ? d.fullImages.split(',') : [d.images];
            const sizes = d.sizes.toString().split(',');
            const colors = d.colors.toString().split(',');

            document.getElementById('details-content').innerHTML = `
                <div class="slider-container mb-6">${imgs.map(img => `<div class="slider-item"><img src="${img.trim()}" class="w-full h-64 object-contain"></div>`).join('')}</div>
                <h1 class="text-2xl font-black">${d.name}</h1>
                <p class="text-2xl font-black text-blue-600 mt-2">${d.price}₾</p>
                <div class="mt-6"><p class="text-[10px] font-black text-slate-400 mb-3 uppercase">ზომა</p>
                    <div class="flex gap-2 overflow-x-auto pb-2">${sizes.map(s => `<button onclick="selectOption(this, 'size', '${id}')" class="size-opt border-2 border-slate-100 px-5 py-3 rounded-2xl font-bold bg-white">${s.trim()}</button>`).join('')}</div></div>
                <div class="mt-6"><p class="text-[10px] font-black text-slate-400 mb-3 uppercase">ფერი</p>
                    <div class="flex gap-2 overflow-x-auto pb-2">${colors.map(c => `<button onclick="selectOption(this, 'color', '${id}')" class="color-opt border-2 border-slate-100 px-5 py-3 rounded-2xl font-bold bg-white">${c.trim()}</button>`).join('')}</div></div>
                <div class="fixed bottom-10 left-0 right-0 px-6"><button id="dynamic-buy-btn" disabled class="w-full bg-slate-300 text-white py-5 rounded-[25px] font-black text-lg cursor-not-allowed transition-all">აირჩიე ზომა</button></div>`;
            document.getElementById('product-details-page').classList.remove('hidden');
        }

        function selectOption(btn, type, productId) {
            const parentClass = type === 'size' ? '.size-opt' : '.color-opt';
            document.querySelectorAll(parentClass).forEach(b => b.classList.remove('selected', 'bg-blue-600', 'text-white', 'border-blue-600'));
            btn.classList.add('selected', 'bg-blue-600', 'text-white', 'border-blue-600');
            const hasSize = document.querySelector('.size-opt.selected');
            const hasColor = document.querySelector('.color-opt.selected');
            const buyBtn = document.getElementById('dynamic-buy-btn');
            if (!hasSize) {
                buyBtn.innerText = "აირჩიე ზომა";
                buyBtn.disabled = true;
            } else if (!hasColor) {
                buyBtn.innerText = "აირჩიე ფერი";
                buyBtn.disabled = false;
                buyBtn.className = "w-full bg-blue-600 text-white py-5 rounded-[25px] font-black text-lg cursor-pointer";
                buyBtn.onclick = () => alert("გთხოვთ აირჩიოთ ფერი");
            } else {
                buyBtn.innerText = "კალათაში დამატება";
                buyBtn.disabled = false;
                buyBtn.className = "w-full bg-blue-600 text-white py-5 rounded-[25px] font-black text-lg shadow-2xl active:scale-95 cursor-pointer";
                buyBtn.onclick = () => handleBuy(productId);
            }
        }

        function handleBuy(id) {
            const sizeEl = document.querySelector('.size-opt.selected');
            const colorEl = document.querySelector('.color-opt.selected');
            const product = storeData.productDetails.find(d => d.id.toString() === id.toString());
            if (!product) return;
            cart.push({
                cartId: Date.now(),
                id: product.id.toString(),
                name: product.name,
                price: parseFloat(product.price) || 0,
                size: sizeEl.innerText,
                color: colorEl.innerText,
                image: (product.images || "").split(',')[0]
            });
            localStorage.setItem('cart', JSON.stringify(cart));
            updateCartBadge();
            const buyBtn = document.getElementById('dynamic-buy-btn');
            buyBtn.innerText = "✅ დაემატა კალათაში";
            buyBtn.className = "w-full bg-green-600 text-white py-5 rounded-[25px] font-black text-lg";
            setTimeout(closeProductDetails, 800);
        }

        function renderCart() {
            const el = document.getElementById('cart-items');
            if (cart.length === 0) {
                el.innerHTML = `<div class="text-center py-20 text-slate-400 font-bold italic">კალათა ცარიელია</div>`;
                document.getElementById('cart-summary').classList.add('hidden');
                document.getElementById('promo-section').classList.add('hidden');
                return;
            }
            document.getElementById('cart-summary').classList.remove('hidden');
            document.getElementById('promo-section').classList.remove('hidden');
            const grouped = cart.reduce((acc, item) => {
                const key = `${item.id}-${item.size}-${item.color}`;
                if (!acc[key]) acc[key] = { ...item, quantity: 1 };
                else acc[key].quantity += 1;
                return acc;
            }, {});
            let subtotal = 0;
            el.innerHTML = Object.values(grouped).map(item => {
                subtotal += item.price * item.quantity;
                return `<div class="bg-white p-4 rounded-[25px] flex items-center gap-4">
                    <img src="${item.image}" class="w-16 h-16 object-contain bg-slate-50 rounded-xl">
                    <div class="flex-1 min-w-0">
                        <h4 class="font-bold text-slate-800 text-xs truncate">${item.name}</h4>
                        <p class="text-[10px] text-slate-400 font-bold">${item.size} / ${item.color}</p>
                        <div class="flex items-center justify-between mt-2">
                            <p class="text-blue-600 font-black text-sm">${item.price}₾</p>
                            <div class="stepper-ui">
                                <div onclick="updateQuantity('${item.id}', '${item.size}', '${item.color}', -1)" class="stepper-btn"><i class="fa-solid fa-minus text-[10px]"></i></div>
                                <span class="mx-2 font-bold text-xs">${item.quantity}</span>
                                <div onclick="updateQuantity('${item.id}', '${item.size}', '${item.color}', 1)" class="stepper-btn !bg-black !text-white"><i class="fa-solid fa-plus text-[10px]"></i></div>
                            </div>
                        </div>
                    </div>
                </div>`;
            }).join('');
            let final = subtotal;
            if (activeDiscountData) {
                final = activeDiscountData.type === 'percent' ? subtotal * (1 - activeDiscountData.value / 100) : subtotal - activeDiscountData.value;
            }
            document.getElementById('cart-total-price').innerText = Math.max(0, Math.round(final)) + "₾";
        }

        function updateQuantity(id, size, color, change) {
            if (change === 1) {
                const item = cart.find(i => String(i.id) === String(id) && String(i.size) === String(size) && String(i.color) === String(color));
                if (item) cart.push({ ...item, cartId: Date.now() });
            } else {
                const idx = cart.findIndex(i => String(i.id) === String(id) && String(i.size) === String(size) && String(i.color) === String(color));
                if (idx > -1) cart.splice(idx, 1);
            }
            localStorage.setItem('cart', JSON.stringify(cart));
            updateCartBadge();
            renderCart();
        }

        function confirmFinalOrder() {
            const name = document.getElementById('order-name').value;
            const phone = document.getElementById('order-phone').value;
            if (!name || !phone) { alert("შეავსეთ სახელი და ნომერი"); return; }
            document.getElementById('payment-final-total').innerText = document.getElementById('cart-total-price').innerText;
            const pList = document.getElementById('payment-methods-list');
            const activeMethods = (storeData.paymentMethods || []).filter(m => m.status && m.status.toString().toLowerCase().trim() === 'active');
            if (activeMethods.length === 0) {
                pList.innerHTML = `<div class="text-center py-10 text-slate-400 font-bold italic">მეთოდები ვერ მოიძებნა</div>`;
            } else {
                pList.innerHTML = activeMethods.map(m => `
                    <div onclick="selectPayment('${m.id}', '${m.title}')" class="bg-white p-5 rounded-[25px] border border-slate-50 flex items-center gap-4 active:scale-95 cursor-pointer mb-3">
                        <div class="w-11 h-11 bg-blue-50 rounded-xl flex items-center justify-center text-blue-500"><i class="fa-solid ${m.icon}"></i></div>
                        <div class="flex-1"><h4 class="font-black text-slate-800 text-[13px]">${m.title}</h4><p class="text-[9px] text-slate-400 uppercase">${m.subtitle}</p></div>
                        <i class="fa-solid fa-chevron-right text-slate-200 text-[10px]"></i>
                    </div>`).join('');
            }
            switchPage('payment');
        }

        async function selectPayment(mid, mtitle) {
            const tg = window.Telegram?.WebApp;
            const params = new URLSearchParams({
                action: "placeOrder",
                userId: (tg?.initDataUnsafe?.user?.id || "000000").toString(),
                customerName: document.getElementById('order-name').value,
                phone: document.getElementById('order-phone').value,
                address: `${document.getElementById('order-city').value}, ${document.getElementById('order-address').value} [${mtitle}]`,
                items: cart.map(i => `${i.name}(${i.size})`).join(', '),
                total: document.getElementById('payment-final-total').innerText.replace('₾', ''),
                promo: activeDiscountData ? activeDiscountData.code : "არა"
            });
            try {
                fetch(`${API_URL}?${params.toString()}`, { mode: 'no-cors' });
                localStorage.removeItem('cart'); cart = [];
                updateCartBadge();
                alert("შეკვეთა მიღებულია!");
                if (tg) tg.close();
            } catch (e) { alert("შეცდომაა"); }
        }

        function switchPage(action) {
            ['home', 'cart', 'checkout', 'payment', 'orders', 'profile'].forEach(p => document.getElementById(p + '-page')?.classList.add('hidden'));
            document.getElementById(action + '-page')?.classList.remove('hidden');
            document.getElementById('main-header').style.display = action === 'home' ? 'block' : 'none';
            if (action === 'cart') renderCart();
            window.scrollTo(0, 0);
        }

        function renderNavigation(items) {
            document.getElementById('bottom-nav').innerHTML = items.map((item, index) => `
                <div onclick="switchPage('${item.action}')" class="nav-item ${index === 0 ? 'active' : ''}">
                    <div class="relative"><i class="fa-solid ${item.icon}"></i>${item.action === 'cart' ? '<div id="cart-count-badge" class="cart-badge hidden">0</div>' : ''}</div>
                    <span>${item.name}</span></div>`).join('');
        }

        function updateCartBadge() {
            const b = document.getElementById('cart-count-badge');
            if (b) { b.innerText = cart.length; b.classList.toggle('hidden', cart.length === 0); }
        }

        function applyPromo() {
            const code = document.getElementById('promo-input').value.trim().toUpperCase();
            const promo = (storeData.promoCodes || []).find(p => p.code.toUpperCase() === code);
            const msg = document.getElementById('promo-msg');
            if (promo) {
                activeDiscountData = promo;
                msg.innerText = `გააქტიურდა: -${promo.value}${promo.type === 'percent' ? '%' : '₾'}`;
                msg.className = "text-green-600 font-bold text-[10px] mt-2";
            } else {
                activeDiscountData = null;
                msg.innerText = "არასწორი კოდი";
                msg.className = "text-red-500 font-bold text-[10px] mt-2";
            }
            renderCart();
        }

        function closeProductDetails() { document.getElementById('product-details-page').classList.add('hidden'); }
        function placeOrder() { switchPage('checkout'); document.getElementById('checkout-total-price').innerText = document.getElementById('cart-total-price').innerText; }
        function renderProfile(menu) { /* Profile render logic as before */ }
        function renderOrders() { /* Orders render logic as before */ }

        init();
    </script>
</body>
</html>
