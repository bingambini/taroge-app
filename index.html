<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shoes Store - v2.7 Final</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8f9fc; margin: 0; padding-bottom: 120px; overflow-x: hidden; }
        
        /* Preloader Styles */
        #app-preloader { transition: opacity 0.5s ease-out; }
        .loader-spin { border: 4px solid #f1f5f9; border-top: 4px solid #2563eb; border-radius: 50%; width: 120px; height: 120px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Existing Styles */
        #main-header { width: 100%; z-index: 9999; position: relative; display: none; }
        .header-container { width: 100%; max-width: 600px; margin: 0 auto; display: flex; align-items: center; height: 100%; padding: 0 20px; }
        .header-floating { margin: 10px auto !important; border-radius: 20px !important; width: calc(100% - 30px) !important; max-width: 570px !important; overflow: hidden; }

        #hero-banner { margin: 20px auto; border-radius: 35px; overflow: hidden; position: relative; max-width: 600px; width: calc(100% - 40px); display: flex; align-items: center; }
        .banner-content { padding: 25px; width: 60%; z-index: 10; position: relative; }
        .banner-img { position: absolute; right: -15px; width: 50%; transform: rotate(-15deg); filter: drop-shadow(0 15px 25px rgba(0,0,0,0.4)); z-index: 5; pointer-events: none; }

        #bottom-nav { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: calc(100% - 40px); max-width: 500px; height: 70px; background: #000; border-radius: 25px; display: flex; justify-content: space-around; align-items: center; z-index: 10000; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: #888; text-decoration: none; transition: 0.3s; cursor: pointer; position: relative; }
        .nav-item.active { color: #fff; }
        .nav-item i { font-size: 20px; margin-bottom: 4px; }
        .nav-item span { font-size: 10px; font-weight: 700; }

        .cart-badge { position: absolute; top: -5px; right: -8px; background: #ef4444; color: white; font-size: 9px; font-weight: 800; min-width: 16px; height: 16px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 2px solid #000; }
        .hidden { display: none; }
        .page-fade { animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .badge { position: absolute; top: 12px; left: 12px; padding: 4px 10px; border-radius: 10px; font-size: 9px; font-weight: 900; text-transform: uppercase; z-index: 10; }
        .badge-sale { background: #ef4444; color: white; }
        .badge-hot { background: #f59e0b; color: white; }
        .badge-new { background: #10b981; color: white; }

        .slider-container { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; gap: 0; scrollbar-width: none; border-radius: 35px; margin-top: -20px; }
        .slider-item { min-width: 100%; scroll-snap-align: start; }
        .slider-item img { width: 100%; aspect-ratio: 1/1; object-fit: contain; background: #fcfcfc; }
        
        .options-scroll { display: flex; overflow-x: auto; gap: 8px; padding-bottom: 5px; scrollbar-width: none; }
        .option-btn { border: 2px solid #f1f5f9; transition: 0.2s; flex: 0 0 auto; white-space: nowrap; outline: none !important; }
        .option-btn.selected { border-color: #2563eb; background: #2563eb; color: white !important; transform: scale(1.05); }

        .stepper-ui { display: flex; align-items: center; background: #f1f5f9; border-radius: 12px; padding: 3px; }
        .stepper-btn { width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; background: white; border-radius: 9px; cursor: pointer; }
        .stepper-count { padding: 0 10px; font-weight: 800; font-size: 13px; min-width: 25px; text-align: center; }

        .promo-box { background: white; border-radius: 20px; padding: 12px; border: 1px dashed #cbd5e1; display: flex; gap: 10px; margin-top: 15px; }
        .promo-input { flex: 1; border: none; outline: none; font-weight: 700; font-size: 12px; background: transparent; }
        .promo-btn { background: #000; color: white; padding: 8px 15px; border-radius: 12px; font-size: 11px; font-weight: 800; }

        .checkout-input { width: 100%; background: white; border: 1px solid #f1f5f9; padding: 14px 18px; font-weight: 700; font-size: 13px; border-radius: 18px; outline: none; }
    </style>
</head>
<body>

    <div id="app-preloader" class="fixed inset-0 z-[100000] bg-white flex flex-col items-center justify-center">
        <div class="relative flex items-center justify-center">
            <div class="loader-spin"></div>
            <div class="absolute w-20 h-20 bg-blue-600 rounded-[25px] flex items-center justify-center shadow-xl animate-pulse">
                <i class="fa-solid fa-shoe-prints text-white text-3xl"></i>
            </div>
        </div>
        <h2 class="mt-8 text-slate-800 font-black text-xl tracking-tight uppercase">Shoes Store</h2>
        <div class="mt-2 flex items-center gap-1.5">
            <span class="text-slate-400 font-bold text-[10px] uppercase tracking-widest">იტვირთება</span>
            <span class="flex gap-1">
                <span class="w-1 h-1 bg-blue-600 rounded-full animate-bounce"></span>
                <span class="w-1 h-1 bg-blue-600 rounded-full animate-bounce [animation-delay:0.2s]"></span>
                <span class="w-1 h-1 bg-blue-600 rounded-full animate-bounce [animation-delay:0.4s]"></span>
            </span>
        </div>
    </div>

    <header id="main-header" class="flex items-center"></header>

    <div id="home-page" class="page-fade">
        <div id="hero-banner"></div>
        <div id="product-grid" class="grid grid-cols-2 gap-4 px-6 mt-4"></div>
    </div>

    <div id="cart-page" class="hidden page-fade px-6 pt-6">
        <h2 class="text-2xl font-black text-slate-800 mb-6">ჩემი კალათა</h2>
        <div id="cart-items" class="space-y-4"></div>
        <div id="promo-section" class="hidden">
            <div class="promo-box">
                <input type="text" id="promo-input" class="promo-input" placeholder="პრომო კოდი...">
                <button onclick="applyPromo()" class="promo-btn">გამოყენება</button>
            </div>
            <p id="promo-msg" class="text-[10px] font-bold mt-2 px-2"></p>
        </div>
        <div id="cart-summary" class="mt-8 border-t pt-6 hidden">
            <div class="flex justify-between items-center mb-6">
                <div><span class="text-slate-500 font-bold">ჯამი:</span><div id="discount-label" class="text-[10px] text-green-600 font-black hidden">ფასდაკლება აქტიურია</div></div>
                <span id="cart-total-price" class="text-2xl font-black text-blue-600">0₾</span>
            </div>
            <button onclick="placeOrder()" class="w-full bg-slate-900 text-white py-5 rounded-[25px] font-black text-lg active:scale-95 transition-all shadow-xl">შეკვეთის გაფორმება</button>
        </div>
    </div>

    <div id="checkout-page" class="hidden page-fade px-6 pt-6 pb-20">
        <div class="flex items-center gap-3 mb-6">
            <button onclick="switchPage('cart')" class="w-10 h-10 bg-white rounded-full flex items-center justify-center shadow-sm"><i class="fa-solid fa-chevron-left text-slate-400"></i></button>
            <h2 class="text-xl font-black text-slate-800">მიწოდება</h2>
        </div>
        <div class="space-y-4">
            <input type="text" id="order-name" class="checkout-input" placeholder="სახელი და გვარი *">
            <input type="tel" id="order-phone" class="checkout-input" placeholder="ტელეფონის ნომერი *">
            <div class="grid grid-cols-2 gap-3"><input type="text" id="order-city" class="checkout-input" placeholder="ქალაქი *"><input type="text" id="order-address" class="checkout-input" placeholder="მისამართი *"></div>
            <textarea id="order-extra" class="checkout-input h-24 pt-3" placeholder="დამატებითი შენიშვნა"></textarea>
        </div>
        <div class="mt-8 border-t pt-6">
            <div class="flex justify-between items-center mb-6"><span class="text-slate-500 font-bold uppercase text-xs">ჯამი:</span><span id="checkout-total-price" class="text-2xl font-black text-blue-600">0₾</span></div>
            <button onclick="confirmFinalOrder()" class="w-full bg-blue-600 text-white py-5 rounded-[25px] font-black text-lg active:scale-95 transition-all">დადასტურება</button>
        </div>
    </div>

    <div id="payment-page" class="hidden page-fade px-6 pt-6 pb-20">
        <div class="flex items-center gap-3 mb-6">
            <button onclick="switchPage('checkout')" class="w-10 h-10 bg-white rounded-full flex items-center justify-center shadow-sm"><i class="fa-solid fa-chevron-left text-slate-400"></i></button>
            <h2 class="text-xl font-black text-slate-800">გადახდა</h2>
        </div>
        <div class="space-y-3">
            <div onclick="selectPayment('Cash', 'კურიერთან გადახდა')" class="bg-white p-5 rounded-[25px] border flex items-center gap-4 active:scale-95 transition-all">
                <div class="w-11 h-11 bg-blue-50 rounded-xl flex items-center justify-center text-blue-500"><i class="fa-solid fa-truck-fast"></i></div>
                <div class="flex-1"><h4 class="font-black text-slate-800 text-[13px]">კურიერთან გადახდა</h4></div>
                <i class="fa-solid fa-chevron-right text-slate-200 text-[10px]"></i>
            </div>
            <div onclick="selectPayment('Card', 'ბარათით გადახდა')" class="bg-white p-5 rounded-[25px] border flex items-center gap-4 active:scale-95 transition-all">
                <div class="w-11 h-11 bg-green-50 rounded-xl flex items-center justify-center text-green-500"><i class="fa-solid fa-credit-card"></i></div>
                <div class="flex-1"><h4 class="font-black text-slate-800 text-[13px]">ბარათით გადახდა</h4></div>
                <i class="fa-solid fa-chevron-right text-slate-200 text-[10px]"></i>
            </div>
        </div>
        <div class="mt-10 p-6 bg-slate-50 rounded-[30px] text-center border-dashed border">
            <span id="payment-final-total" class="text-3xl font-black text-blue-600">0₾</span>
        </div>
    </div>

    <div id="profile-page" class="hidden page-fade"></div>
    <div id="orders-page" class="hidden page-fade px-6 pt-6"><div id="orders-list" class="space-y-3"></div></div>

    <div id="product-details-page" class="hidden fixed inset-0 bg-white z-[30000] overflow-y-auto pb-40">
        <div class="sticky top-0 bg-white/90 backdrop-blur-md z-10 flex justify-between p-6">
            <button onclick="closeProductDetails()" class="w-12 h-12 bg-slate-50 rounded-full flex items-center justify-center"><i class="fa-solid fa-arrow-left"></i></button>
        </div>
        <div id="details-content" class="px-6 page-fade"></div>
    </div>

    <div id="product-sheet-overlay" class="fixed inset-0 bg-black/60 z-[20000] hidden opacity-0 transition-opacity duration-300" onclick="closeProductSheet()">
        <div id="product-sheet" class="absolute bottom-0 left-0 right-0 bg-white rounded-t-[40px] p-8 transform translate-y-full transition-transform duration-300" onclick="event.stopPropagation()">
            <div id="sheet-content"></div>
        </div>
    </div>
    
    <nav id="bottom-nav"></nav>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbzlFXWDikCWQFa1FhMMbN0DtaKArKyK6-NoJqN0zK3k4gDsSPz6YK57Hd_B63bOyofPMg/exec";
        const PROMO_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQH2mZB4PnZn6hJJRPgC_Ry0HTt7BvKiNmcNGyx7PVOMHY0rNFqhM4MneVoRI3kT00y6vxMMOoHbipA/pub?output=csv";
        
        let storeData = null;
        let cart = JSON.parse(localStorage.getItem('cart')) || [];
        let activeDiscountData = null;

        async function init() {
            if (window.Telegram?.WebApp) {
                window.Telegram.WebApp.ready();
                window.Telegram.WebApp.expand();
            }

            try {
                const res = await fetch(API_URL);
                storeData = await res.json();
                
                if (storeData.header) renderHeader(storeData.header);
                if (storeData.banner) renderBanner(storeData.banner);
                if (storeData.latest) renderProducts(storeData.latest);
                if (storeData.navigation) renderNavigation(storeData.navigation);
                if (storeData.profileMenu) renderProfile(storeData.profileMenu);
                
                updateCartBadge();
                
                // Hide Preloader
                const loader = document.getElementById('app-preloader');
                loader.style.opacity = '0';
                setTimeout(() => loader.style.display = 'none', 500);

            } catch (e) { 
                console.error(e);
                document.getElementById('app-preloader').style.display = 'none';
            }
        }

        // --- All core functions from v2.6 remain exactly the same ---
        function renderHeader(h) {
            const el = document.getElementById('main-header');
            if (h.status !== 'active') return;
            el.style.display = 'flex';
            el.style.backgroundColor = h.bg || "#24afeb";
            el.style.height = (parseInt(h.height) || 80) + "px";
            el.style.color = h.textColor || "#ffffff";
            if (h.style === 'floating') el.classList.add('header-floating');
            el.innerHTML = `<div class="header-container" style="justify-content: ${h.layout === 'center' ? 'center' : 'space-between'}">
                <div class="flex items-center gap-3"><img src="${h.logo}" style="width: 45px; border-radius: ${h.logoRadius}%"><span style="font-weight: 800; font-size: 18px">${h.name || ''}</span></div>
                ${h.layout !== 'center' ? '<div><i class="fa-solid fa-bell text-xl"></i></div>' : ''}
            </div>`;
        }

        function renderBanner(b) {
            const el = document.getElementById('hero-banner');
            el.style.height = (parseInt(b.height) || 180) + "px";
            el.style.marginTop = (parseInt(b.marginTop) || 20) + "px";
            el.style.background = b.gradient === "1" ? "linear-gradient(135deg, #1e293b 0%, #334155 100%)" : "#1e293b";
            el.innerHTML = `<div class="banner-content"><h2 style="font-size: ${parseInt(b.titleSize)}px; color: white; font-weight: 900;">${b.title}</h2><p style="color: rgba(255,255,255,0.7); font-size: 10px; margin-top: 8px;">${b.subtitle || ''}</p><button class="mt-5 bg-white text-black px-6 py-2.5 rounded-2xl text-[10px] font-black uppercase">${b.btnText}</button></div><img src="${b.image}" class="banner-img">`;
        }

        function renderProducts(l) {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = l.items.map((p, idx) => {
                const details = storeData.productDetails.find(d => d.id.toString() === p.id.toString());
                return `<div onclick="openProductSheet(${idx})" class="bg-white p-4 rounded-[30px] border shadow-sm active:scale-95 transition-all relative overflow-hidden">
                    ${details?.status ? `<span class="badge badge-${details.status.toLowerCase()}">${details.status}</span>` : ''}
                    <img src="${p.images.split(',')[0]}" class="h-24 mx-auto object-contain">
                    <h4 class="font-bold text-[11px] text-slate-700 truncate mt-3">${p.name}</h4>
                    <p class="text-blue-600 font-black text-sm mt-1">${p.price}₾</p>
                </div>`;
            }).join('');
        }

        function openProductSheet(index) {
            const p = storeData.latest.items[index];
            const overlay = document.getElementById('product-sheet-overlay');
            const sheet = document.getElementById('product-sheet');
            document.getElementById('sheet-content').innerHTML = `
                <div class="flex flex-col items-center">
                    <div class="w-full aspect-square bg-slate-50 rounded-[30px] flex items-center justify-center mb-6 overflow-hidden"><img src="${p.images.split(',')[0]}" class="w-4/5 h-4/5 object-contain"></div>
                    <h3 class="text-2xl font-black text-slate-800 text-center leading-tight">${p.name}</h3>
                    <p class="text-3xl font-black text-blue-600 mt-3">${p.price}₾</p>
                    <button onclick="goToProductDetails('${p.id}')" class="w-full mt-10 bg-slate-900 text-white py-5 rounded-[25px] font-black text-lg active:scale-95 transition-all">დეტალურად <i class="fa-solid fa-arrow-right ml-2 text-sm"></i></button>
                </div>`;
            overlay.classList.remove('hidden');
            setTimeout(() => { overlay.classList.add('opacity-100'); sheet.classList.remove('translate-y-full'); }, 10);
        }

        function closeProductSheet() {
            const overlay = document.getElementById('product-sheet-overlay');
            const sheet = document.getElementById('product-sheet');
            sheet.classList.add('translate-y-full');
            overlay.classList.remove('opacity-100');
            setTimeout(() => overlay.classList.add('hidden'), 300);
        }

        function goToProductDetails(id) {
            closeProductSheet();
            const details = storeData.productDetails.find(d => d.id.toString() === id.toString());
            if (!details) return;
            const images = details.fullImages ? details.fullImages.split(',') : [details.images];
            const sizes = details.sizes ? details.sizes.toString().split(',') : [];
            const colors = details.colors ? details.colors.toString().split(',') : [];
            document.getElementById('details-content').innerHTML = `
                <div class="relative mb-6"><div class="slider-container">${images.map(img => `<div class="slider-item"><img src="${img.trim()}"></div>`).join('')}</div></div>
                <div class="flex justify-between items-start mb-6"><div class="flex-1"><h1 class="text-2xl font-black text-slate-800 leading-tight">${details.name}</h1><span class="text-[10px] font-bold text-slate-400">ID: ${details.id}</span></div><div class="text-right"><span class="text-2xl font-black text-blue-600">${details.price}₾</span></div></div>
                <p class="text-slate-600 text-sm leading-relaxed mb-8">${details.description || ''}</p>
                <div class="mb-6"><h4 class="text-[10px] font-black text-slate-400 uppercase mb-3">ზომა</h4><div class="options-scroll">${sizes.map(s => `<button onclick="selectOption(this, 'size', '${details.id}')" class="option-btn size-opt px-5 py-3 rounded-2xl font-bold bg-white">${s.trim()}</button>`).join('')}</div></div>
                <div class="mb-10"><h4 class="text-[10px] font-black text-slate-400 uppercase mb-3">ფერი</h4><div class="options-scroll">${colors.map(c => `<button onclick="selectOption(this, 'color', '${details.id}')" class="option-btn color-opt px-5 py-3 rounded-2xl font-bold bg-white">${c.trim()}</button>`).join('')}</div></div>
                <div class="fixed bottom-10 left-0 right-0 px-6 z-20"><button id="dynamic-buy-btn" disabled class="w-full bg-slate-300 text-white py-5 rounded-[25px] font-black text-lg">აირჩიე ზომა</button></div>`;
            document.getElementById('product-details-page').classList.remove('hidden');
        }

        function selectOption(btn, type, productId) {
            const cls = type === 'size' ? '.size-opt' : '.color-opt';
            document.querySelectorAll(cls).forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            const hasS = document.querySelector('.size-opt.selected');
            const hasC = document.querySelector('.color-opt.selected');
            const buyBtn = document.getElementById('dynamic-buy-btn');
            if (hasS && hasC) {
                buyBtn.innerText = "კალათაში დამატება"; buyBtn.disabled = false;
                buyBtn.className = "w-full bg-blue-600 text-white py-5 rounded-[25px] font-black text-lg active:scale-95 shadow-xl shadow-blue-200";
                buyBtn.onclick = () => handleBuy(productId);
            } else if (hasS) { buyBtn.innerText = "აირჩიე ფერი"; buyBtn.disabled = true; buyBtn.className = "w-full bg-blue-600/50 text-white py-5 rounded-[25px] font-black text-lg"; }
        }

        function handleBuy(id) {
            const s = document.querySelector('.size-opt.selected').innerText;
            const c = document.querySelector('.color-opt.selected').innerText;
            const p = storeData.productDetails.find(d => d.id.toString() === id.toString());
            cart.push({ cartId: Date.now(), id: p.id, name: p.name, price: parseFloat(p.price), size: s, color: c, image: p.images.split(',')[0] });
            localStorage.setItem('cart', JSON.stringify(cart));
            updateCartBadge();
            const b = document.getElementById('dynamic-buy-btn');
            b.innerText = "✅ დაემატა"; b.classList.replace('bg-blue-600', 'bg-green-600');
            setTimeout(() => document.getElementById('product-details-page').classList.add('hidden'), 800);
        }

        function renderCart() {
            const el = document.getElementById('cart-items');
            if (cart.length === 0) {
                el.innerHTML = `<div class="text-center py-20 text-slate-400 font-bold italic">კალათა ცარიელია</div>`;
                document.getElementById('cart-summary').classList.add('hidden');
                document.getElementById('promo-section').classList.add('hidden');
                return;
            }
            document.getElementById('cart-summary').classList.remove('hidden');
            document.getElementById('promo-section').classList.remove('hidden');
            const grouped = cart.reduce((acc, item) => {
                const key = `${item.id}-${item.size}-${item.color}`;
                if (!acc[key]) acc[key] = { ...item, quantity: 1 };
                else acc[key].quantity += 1;
                return acc;
            }, {});
            let subtotal = 0;
            el.innerHTML = Object.values(grouped).map(i => {
                subtotal += i.price * i.quantity;
                return `<div class="bg-white p-4 rounded-[25px] border flex items-center gap-4">
                    <img src="${i.image}" class="w-16 h-16 object-contain bg-slate-50 rounded-xl">
                    <div class="flex-1 min-w-0">
                        <h4 class="font-bold text-slate-800 text-xs truncate">${i.name}</h4>
                        <p class="text-[10px] text-slate-400 font-bold">${i.size} / ${i.color}</p>
                        <div class="flex items-center justify-between mt-2">
                            <p class="text-blue-600 font-black text-sm">${i.price}₾</p>
                            <div class="stepper-ui">
                                <div onclick="updateQuantity('${i.id}', '${i.size}', '${i.color}', -1)" class="stepper-btn"><i class="fa-solid fa-minus text-[10px]"></i></div>
                                <span class="stepper-count">${i.quantity}</span>
                                <div onclick="updateQuantity('${i.id}', '${i.size}', '${i.color}', 1)" class="stepper-btn !bg-slate-900 !text-white"><i class="fa-solid fa-plus text-[10px]"></i></div>
                            </div>
                        </div>
                    </div>
                </div>`;
            }).join('');
            let final = subtotal;
            if (activeDiscountData) final = activeDiscountData.type === 'percent' ? subtotal * (1 - activeDiscountData.value/100) : subtotal - activeDiscountData.value;
            document.getElementById('cart-total-price').innerText = Math.round(final > 0 ? final : 0) + "₾";
        }

        async function applyPromo() {
            const code = document.getElementById('promo-input').value.trim().toUpperCase();
            if (!code) return;
            try {
                const res = await fetch(PROMO_CSV_URL);
                const text = await res.text();
                const promo = text.split('\n').slice(1).map(r => {
                    const c = r.split(',');
                    return { code: c[0]?.trim().toUpperCase(), type: c[1]?.trim().toLowerCase(), value: parseFloat(c[2]) };
                }).find(p => p.code === code);
                if (promo) {
                    activeDiscountData = promo;
                    document.getElementById('promo-msg').className = "text-[10px] font-bold mt-2 px-2 text-green-600";
                    document.getElementById('promo-msg').innerText = "გააქტიურდა!";
                    document.getElementById('discount-label').classList.remove('hidden');
                } else {
                    activeDiscountData = null;
                    document.getElementById('promo-msg').className = "text-[10px] font-bold mt-2 px-2 text-red-500";
                    document.getElementById('promo-msg').innerText = "არასწორი კოდი";
                }
                renderCart();
            } catch (e) { console.error(e); }
        }

        function updateQuantity(id, size, color, change) {
            const idx = cart.findIndex(i => String(i.id) === String(id) && i.size === size && i.color === color);
            if (idx > -1) {
                if (change === 1) cart.push({ ...cart[idx], cartId: Date.now() });
                else cart.splice(idx, 1);
                localStorage.setItem('cart', JSON.stringify(cart));
                updateCartBadge();
                renderCart();
            }
        }

        function updateCartBadge() {
            const b = document.getElementById('cart-count-badge');
            if (b) { if (cart.length > 0) { b.innerText = cart.length; b.classList.remove('hidden'); } else b.classList.add('hidden'); }
        }

        function switchPage(action, btn) {
            const pages = { home: 'home-page', profile: 'profile-page', orders: 'orders-page', cart: 'cart-page', checkout: 'checkout-page', payment: 'payment-page' };
            Object.values(pages).forEach(p => document.getElementById(p)?.classList.add('hidden'));
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            if (pages[action]) document.getElementById(pages[action]).classList.remove('hidden');
            if (action === 'home') document.getElementById('main-header').classList.remove('hidden');
            else document.getElementById('main-header').classList.add('hidden');
            if (action === 'cart') renderCart();
            if (action === 'orders') renderOrders();
            window.scrollTo(0, 0);
        }

        function renderNavigation(items) {
            document.getElementById('bottom-nav').innerHTML = items.map((i, idx) => `
                <div onclick="switchPage('${i.action}', this)" class="nav-item ${idx === 0 ? 'active' : ''}">
                    <div class="relative"><i class="fa-solid ${i.icon}"></i>${i.action === 'cart' ? `<div id="cart-count-badge" class="cart-badge hidden">0</div>` : ''}</div>
                    <span>${i.name}</span>
                </div>`).join('');
            updateCartBadge();
        }

        function renderProfile(menu) {
            const user = window.Telegram?.WebApp?.initDataUnsafe?.user || { first_name: "სტუმარი", id: "0" };
            const photo = user.photo_url || `https://ui-avatars.com/api/?name=${user.first_name}`;
            document.getElementById('profile-page').innerHTML = `
                <div class="flex items-center gap-4 p-6"><img src="${photo}" class="w-16 h-16 rounded-full border-4 border-white shadow-lg"><div><h2 class="text-lg font-black">${user.first_name}</h2><p class="text-slate-400 text-[10px]">ID: ${user.id}</p></div></div>
                <div class="px-6 space-y-2">${menu.map(m => `<div onclick="switchPage('${m.action}', this)" class="bg-white p-3.5 rounded-[22px] flex items-center justify-between border active:scale-95 transition-all"><div class="flex items-center gap-3"><div class="w-9 h-9 bg-slate-50 rounded-xl flex items-center justify-center text-slate-500"><i class="fa-solid ${m.icon}"></i></div><span class="font-bold text-slate-700 text-sm">${m.label}</span></div><i class="fa-solid fa-chevron-right text-slate-300 text-[10px]"></i></div>`).join('')}</div>`;
        }

        function renderOrders() {
            const userId = (window.Telegram?.WebApp?.initDataUnsafe?.user?.id || "0").toString();
            const my = storeData.orders.filter(o => o.userId.toString() === userId);
            document.getElementById('orders-list').innerHTML = my.length ? my.map(o => `<div class="bg-white p-4 rounded-[25px] border shadow-sm"><div class="flex justify-between mb-3"><span class="text-[10px] font-black text-blue-600">ID: ${o.orderId}</span><span class="bg-blue-50 text-blue-600 px-3 py-1 rounded-full text-[9px] font-black uppercase">${o.status}</span></div><p class="text-xs font-bold text-slate-700 mb-1">${o.items}</p><p class="text-lg font-black">${o.total}₾</p></div>`).join('') : `<div class="text-center py-20 text-slate-400 italic">შეკვეთები არ გაქვთ</div>`;
        }

        function placeOrder() { switchPage('checkout'); document.getElementById('checkout-total-price').innerText = document.getElementById('cart-total-price').innerText; }
        function confirmFinalOrder() {
            if (!document.getElementById('order-name').value || !document.getElementById('order-phone').value) return alert("შეავსეთ ველები!");
            document.getElementById('payment-final-total').innerText = document.getElementById('checkout-total-price').innerText;
            switchPage('payment');
        }

        async function selectPayment(id, title) {
            const tg = window.Telegram.WebApp;
            const params = new URLSearchParams({
                action: "placeOrder",
                userId: (tg.initDataUnsafe?.user?.id || "0").toString(),
                customerName: document.getElementById('order-name').value,
                phone: document.getElementById('order-phone').value,
                address: `${document.getElementById('order-city').value}, ${document.getElementById('order-address').value} [${title}]`,
                items: cart.map(i => `${i.name} (${i.size})`).join(', '),
                total: document.getElementById('checkout-total-price').innerText.replace('₾',''),
                promo: activeDiscountData?.code || "არა"
            });
            try {
                fetch(`${API_URL}?${params.toString()}`, { mode: 'no-cors' });
                tg.sendData(JSON.stringify({ action: "order", message: "შეკვეთა გაიგზავნა!" }));
                localStorage.removeItem('cart'); cart = []; updateCartBadge();
                alert("შეკვეთა მიღებულია!"); tg.close();
            } catch (e) { alert("შეცდომაა!"); }
        }

        function closeProductDetails() { document.getElementById('product-details-page').classList.add('hidden'); }

        init();
    </script>
</body>
</html>
