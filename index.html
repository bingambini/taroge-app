<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shoes Store</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app-preloader">
        <div class="loader-spin"></div>
        <p style="margin-top: 20px; font-weight: 800; color: #1e293b;">იტვირთება...</p>
    </div>

    <header id="main-header"></header>

    <div id="home-page" class="page-fade">
        <div id="hero-banner"></div>
        <div id="product-grid" class="grid grid-cols-2 gap-4 px-6 mt-4"></div>
    </div>

    <div id="cart-page" class="hidden page-fade px-6 pt-6">
        <h2 class="text-2xl font-black mb-6">ჩემი კალათა</h2>
        <div id="cart-items" class="space-y-4"></div>
        <div id="cart-summary" class="mt-8 border-t pt-6 hidden">
            <div class="flex justify-between items-center mb-6">
                <span class="font-bold">ჯამი:</span>
                <span id="cart-total-price" class="text-2xl font-black text-blue-600">0₾</span>
            </div>
            <button onclick="switchPage('checkout')" class="w-full bg-slate-900 text-white py-5 rounded-[25px] font-black">შეკვეთის გაფორმება</button>
        </div>
    </div>

    <div id="checkout-page" class="hidden page-fade px-6 pt-6">
        <h2 class="text-xl font-black mb-6">მიწოდების მონაცემები</h2>
        <div class="space-y-4">
            <input type="text" id="order-name" class="checkout-input" placeholder="სახელი და გვარი *">
            <input type="tel" id="order-phone" class="checkout-input" placeholder="ტელეფონი *">
            <input type="text" id="order-address" class="checkout-input" placeholder="მისამართი *">
            <button onclick="confirmFinalOrder()" class="w-full bg-blue-600 text-white py-5 rounded-[25px] font-black mt-4">შეკვეთის დადასტურება</button>
        </div>
    </div>

    <div id="product-details-page" class="hidden fixed inset-0 bg-white z-[30000] overflow-y-auto pb-40">
        <div class="sticky top-0 bg-white/90 backdrop-blur-md z-10 flex justify-between items-center p-6">
            <button onclick="closeProductDetails()" class="w-12 h-12 bg-slate-50 rounded-full flex items-center justify-center">
                <i class="fa-solid fa-arrow-left"></i>
            </button>
            <h3 class="font-bold">პროდუქტი</h3>
            <div class="w-12"></div>
        </div>
        <div id="details-content" class="px-6"></div>
    </div>

    <nav id="bottom-nav"></nav>

    <script src="script.js"></script>
</body>
</html>
