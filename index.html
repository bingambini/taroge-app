<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shoes Store - Optimized 2.6</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8f9fc; margin: 0; padding-bottom: 120px; overflow-x: hidden; }
        
        #main-header { width: 100%; z-index: 9999; position: relative; display: none; }
        .header-container { width: 100%; max-width: 600px; margin: 0 auto; display: flex; align-items: center; height: 100%; padding: 0 20px; }
        .header-floating { margin: 10px auto !important; border-radius: 20px !important; width: calc(100% - 30px) !important; max-width: 570px !important; overflow: hidden; }

        #hero-banner { margin: 20px auto; border-radius: 35px; overflow: hidden; position: relative; max-width: 600px; width: calc(100% - 40px); display: flex; align-items: center; }
        .banner-content { padding: 25px; width: 60%; z-index: 10; position: relative; }
        .banner-img { position: absolute; right: -15px; width: 50%; transform: rotate(-15deg); filter: drop-shadow(0 15px 25px rgba(0,0,0,0.4)); z-index: 5; pointer-events: none; }

        #bottom-nav {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            width: calc(100% - 40px); max-width: 500px; height: 70px;
            background: #000000; border-radius: 25px;
            display: flex; justify-content: space-around; align-items: center;
            z-index: 10000; box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: #888888; text-decoration: none; transition: all 0.3s ease; cursor: pointer; }
        .nav-item.active { color: #ffffff; }
        .nav-item i { font-size: 20px; margin-bottom: 4px; }
        .nav-item span { font-size: 10px; font-weight: 700; }

        .hidden { display: none; }
        .page-fade { animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* ბეჯების სტილები */
        .badge { position: absolute; top: 12px; left: 12px; padding: 4px 10px; border-radius: 10px; font-size: 9px; font-weight: 900; text-transform: uppercase; z-index: 10; }
        .badge-sale { background: #ef4444; color: white; }
        .badge-hot { background: #f59e0b; color: white; }
        .badge-new { background: #10b981; color: white; }

        .size-btn.selected { background-color: #2563eb; color: white; border-color: #2563eb; transform: scale(1.05); }
    </style>
</head>
<body>

    <header id="main-header" class="flex items-center"></header>

    <div id="home-page" class="page-fade">
        <div id="hero-banner"></div>
        <div id="product-grid" class="grid grid-cols-2 gap-4 px-6 mt-4"></div>
    </div>

    <div id="profile-page" class="hidden page-fade"></div>

    <div id="orders-page" class="hidden page-fade px-6 pt-6">
        <div class="flex items-center gap-3 mb-6">
            <button onclick="switchPage('home', this)" class="w-10 h-10 bg-white rounded-full flex items-center justify-center shadow-sm active:scale-90 transition-all">
                <i class="fa-solid fa-chevron-left text-slate-400"></i>
            </button>
            <h2 class="text-xl font-black text-slate-800">ჩემი შეკვეთები</h2>
        </div>
        <div id="orders-list" class="space-y-3"></div>
    </div>

    <div id="product-details-page" class="hidden fixed inset-0 bg-white z-[30000] overflow-y-auto pb-40">
        <div class="sticky top-0 bg-white/90 backdrop-blur-md z-10 flex justify-between items-center p-6">
            <button onclick="closeProductDetails()" class="w-12 h-12 bg-slate-50 rounded-full flex items-center justify-center active:scale-90">
                <i class="fa-solid fa-arrow-left text-slate-800"></i>
            </button>
            <h3 class="font-bold text-slate-800">პროდუქტი</h3>
            <button class="w-12 h-12 bg-slate-50 rounded-full flex items-center justify-center">
                <i class="fa-solid fa-heart text-slate-400"></i>
            </button>
        </div>
        <div id="details-content" class="px-6 page-fade"></div>
    </div>

    <div id="product-sheet-overlay" class="fixed inset-0 bg-black/60 z-[20000] hidden opacity-0" onclick="closeProductSheet()">
        <div id="product-sheet" class="absolute bottom-0 left-0 right-0 bg-white rounded-t-[40px] p-8 transform translate-y-full transition-transform duration-300" onclick="event.stopPropagation()">
            <div class="w-12 h-1.5 bg-slate-200 rounded-full mx-auto mb-8"></div>
            <div id="sheet-content"></div>
        </div>
    </div>
    
    <nav id="bottom-nav"></nav>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbyY5uvJNCs2Ib7XiFFpQALwoCi2_TX2uY04eR6NhTMXYSAx_sbm13JwJQDa5UgrSWkZ6A/exec";
        let storeData = null;

        async function init() {
            if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.ready();
                window.Telegram.WebApp.expand();
            }
            try {
                const res = await fetch(API_URL);
                storeData = await res.json();
                
                if (storeData.header) renderHeader(storeData.header);
                if (storeData.banner) renderBanner(storeData.banner);
                if (storeData.latest) renderProducts(storeData.latest);
                if (storeData.navigation) renderNavigation(storeData.navigation);
                if (storeData.profileMenu) renderProfile(storeData.profileMenu);
            } catch (e) { console.error("Error:", e); }
        }

        function renderHeader(h) {
            const el = document.getElementById('main-header');
            if (h.status !== 'active') return;
            el.style.display = 'flex';
            el.style.backgroundColor = h.bg || "#24afeb";
            el.style.height = (parseInt(h.height) || 80) + "px";
            el.style.color = h.textColor || "#ffffff";
            if (h.style === 'floating') el.classList.add('header-floating');
            el.innerHTML = `
                <div class="header-container" style="justify-content: ${h.layout === 'center' ? 'center' : 'space-between'}">
                    <div class="flex items-center gap-3">
                        <img src="${h.logo}" style="width: 45px; border-radius: ${h.logoRadius}%">
                        <span style="font-weight: 800; font-size: 18px">${h.name || ''}</span>
                    </div>
                    ${h.layout !== 'center' ? '<div><i class="fa-solid fa-bell text-xl"></i></div>' : ''}
                </div>`;
        }

        function renderBanner(b) {
            const el = document.getElementById('hero-banner');
            el.style.height = (parseInt(b.height) || 180) + "px";
            el.style.marginTop = (parseInt(b.marginTop) || 20) + "px";
            el.style.background = b.gradient === "1" ? "linear-gradient(135deg, #1e293b 0%, #334155 100%)" : "#1e293b";
            el.innerHTML = `
                <div class="banner-content">
                    <h2 style="font-size: ${parseInt(b.titleSize)}px; color: white; font-weight: 900; line-height: 1.1;">${b.title}</h2>
                    <p style="color: rgba(255,255,255,0.7); font-size: 10px; margin-top: 8px; font-weight: 700;">${b.subtitle || ''}</p>
                    <button class="mt-5 bg-white text-black px-6 py-2.5 rounded-2xl text-[10px] font-black uppercase">${b.btnText}</button>
                </div>
                <img src="${b.image}" class="banner-img">`;
        }

        function renderProducts(l) {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = l.items.map((p, index) => {
                // ვეძებთ დამატებით ინფორმაციას (ბეჯისთვის)
                const details = storeData.productDetails.find(d => d.id.toString() === p.id.toString());
                const statusBadge = details && details.status ? `<span class="badge badge-${details.status.toLowerCase()}">${details.status}</span>` : '';
                
                return `
                <div onclick="openProductSheet(${index})" class="bg-white p-4 rounded-[30px] border border-slate-100 shadow-sm active:scale-95 transition-all cursor-pointer relative overflow-hidden">
                    ${statusBadge}
                    <img src="${p.images.split(',')[0]}" class="h-24 mx-auto object-contain">
                    <h4 class="font-bold text-[11px] text-slate-700 truncate mt-3">${p.name}</h4>
                    <p class="text-blue-600 font-black text-sm mt-1">${p.price}₾</p>
                </div>`;
            }).join('');
        }

        function openProductSheet(index) {
            const p = storeData.latest.items[index];
            const overlay = document.getElementById('product-sheet-overlay');
            const sheet = document.getElementById('product-sheet');
            const content = document.getElementById('sheet-content');

            content.innerHTML = `
                <div class="flex flex-col items-center">
                    <div class="w-full aspect-square bg-slate-50 rounded-[30px] flex items-center justify-center mb-6 overflow-hidden">
                        <img src="${p.images.split(',')[0]}" class="w-4/5 h-4/5 object-contain">
                    </div>
                    <h3 class="text-2xl font-black text-slate-800 text-center leading-tight">${p.name}</h3>
                    <p class="text-3xl font-black text-blue-600 mt-3">${p.price}₾</p>
                    <button onclick="goToProductDetails('${p.id}')" class="w-full mt-10 bg-slate-900 text-white py-5 rounded-[25px] font-black text-lg active:scale-95 transition-all flex items-center justify-center gap-3 shadow-xl shadow-slate-200">
                        დეტალურად <i class="fa-solid fa-arrow-right text-sm"></i>
                    </button>
                </div>
            `;
            overlay.classList.remove('hidden');
            setTimeout(() => {
                overlay.classList.add('opacity-100');
                sheet.classList.remove('translate-y-full');
            }, 10);
        }

        function closeProductSheet() {
            const overlay = document.getElementById('product-sheet-overlay');
            const sheet = document.getElementById('product-sheet');
            sheet.classList.add('translate-y-full');
            overlay.classList.remove('opacity-100');
            setTimeout(() => overlay.classList.add('hidden'), 300);
        }

        function goToProductDetails(id) {
            closeProductSheet();
            const details = storeData.productDetails.find(d => d.id.toString() === id.toString());
            const el = document.getElementById('details-content');
            const page = document.getElementById('product-details-page');

            if (!details) {
                alert("ამ პროდუქტის დეტალები ვერ მოიძებნა!");
                return;
            }

            const images = details.fullImages ? details.fullImages.split(',') : [details.images];
            const sizes = details.sizes ? details.sizes.toString().split(',') : [];

            el.innerHTML = `
                <div class="mb-8 relative">
                    ${details.status ? `<span class="badge badge-${details.status.toLowerCase()} !text-[11px] !py-1.5 !px-4 !top-4 !left-4">${details.status}</span>` : ''}
                    <img src="${images[0].trim()}" class="w-full rounded-[40px] shadow-2xl shadow-slate-200 aspect-square object-cover bg-slate-50">
                </div>
                
                <div class="flex justify-between items-start mb-6">
                    <h1 class="text-3xl font-black text-slate-800 w-2/3 leading-tight">${details.name}</h1>
                    <div class="text-right">
                        ${details.oldPrice ? `<span class="block text-slate-400 line-through text-sm font-bold italic">${details.oldPrice}₾</span>` : ''}
                        <span class="block text-3xl font-black text-blue-600">${details.price}₾</span>
                    </div>
                </div>

                <div class="mb-8">
                    <h4 class="font-bold text-slate-400 uppercase text-[10px] tracking-widest mb-3 italic">აღწერა</h4>
                    <p class="text-slate-500 leading-relaxed text-sm font-medium">${details.description || 'აღწერა არ არის'}</p>
                </div>

                ${sizes.length > 0 ? `
                <div class="mb-8">
                    <h4 class="font-bold text-slate-400 uppercase text-[10px] tracking-widest mb-4 italic">აირჩიე ზომა</h4>
                    <div class="flex flex-wrap gap-3">
                        ${sizes.map(s => `
                            <button onclick="selectSize(this)" class="size-btn w-14 h-14 border-2 border-slate-100 rounded-2xl flex items-center justify-center font-bold text-slate-700 active:scale-90 transition-all">${s.trim()}</button>
                        `).join('')}
                    </div>
                </div>` : ''}

                <div class="fixed bottom-10 left-0 right-0 px-6 z-20">
                    <button onclick="handleBuy('${details.id}')" class="w-full bg-blue-600 text-white py-5 rounded-[25px] font-black text-lg shadow-2xl shadow-blue-300 active:scale-95 transition-all">
                        ყიდვა
                    </button>
                </div>
            `;
            page.classList.remove('hidden');
        }

        function handleBuy(id) {
            const selectedSize = document.querySelector('.size-btn.selected');
            if (!selectedSize) {
                alert("გთხოვთ აირჩიოთ ზომა!");
                return;
            }
            alert("შეკვეთა მიღებულია! ზომა: " + selectedSize.innerText);
        }

        function selectSize(btn) {
            document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
        }

        function closeProductDetails() {
            document.getElementById('product-details-page').classList.add('hidden');
        }

        function renderNavigation(items) {
            const nav = document.getElementById('bottom-nav');
            nav.innerHTML = items.map((item, index) => `
                <div onclick="switchPage('${item.action}', this)" class="nav-item ${index === 0 ? 'active' : ''}">
                    <i class="fa-solid ${item.icon}"></i> 
                    <span>${item.name}</span>
                </div>`).join('');
        }

        function renderProfile(menu) {
            const el = document.getElementById('profile-page');
            const tg = window.Telegram.WebApp;
            const user = tg.initDataUnsafe?.user || { first_name: "სტუმარი", id: "00000000" };
            const photoUrl = user.photo_url || `https://ui-avatars.com/api/?name=${encodeURIComponent(user.first_name)}&background=random`;

            el.innerHTML = `
                <div class="flex items-center gap-4 pt-6 pb-6 px-6">
                    <img src="${photoUrl}" class="w-16 h-16 rounded-full border-4 border-white shadow-lg object-cover">
                    <div>
                        <h2 class="text-lg font-black text-slate-800 leading-tight">${user.first_name}</h2>
                        <p class="text-slate-400 text-[10px] font-bold mt-0.5">ID: ${user.id}</p>
                    </div>
                </div>
                <div class="px-6 space-y-2">
                    ${menu.map(m => `
                        <div onclick="switchPage('${m.action}', this)" class="bg-white p-3.5 rounded-[22px] flex items-center justify-between border border-slate-50 shadow-sm active:scale-95 cursor-pointer transition-all">
                            <div class="flex items-center gap-3">
                                <div class="w-9 h-9 bg-slate-50 rounded-xl flex items-center justify-center text-slate-500 text-sm">
                                    <i class="fa-solid ${m.icon}"></i>
                                </div>
                                <span class="font-bold text-slate-700 text-sm">${m.label}</span>
                            </div>
                            <i class="fa-solid fa-chevron-right text-slate-300 text-[10px] mr-1"></i>
                        </div>`).join('')}
                </div>`;
        }

        function switchPage(action, btn) {
            const home = document.getElementById('home-page');
            const profile = document.getElementById('profile-page');
            const orders = document.getElementById('orders-page');
            const header = document.getElementById('main-header');
            [home, profile, orders].forEach(p => p.classList.add('hidden'));
            
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));

            if (action === 'profile') {
                profile.classList.remove('hidden');
                header.classList.add('hidden');
                if (btn) btn.classList.add('active');
            } else if (action === 'orders') {
                orders.classList.remove('hidden');
                header.classList.add('hidden');
                renderOrders();
                if (btn) btn.classList.add('active');
            } else {
                home.classList.remove('hidden');
                header.classList.remove('hidden');
                if (btn) btn.classList.add('active');
            }
        }

        function renderOrders() {
            const el = document.getElementById('orders-list');
            const tg = window.Telegram.WebApp;
            const currentUserId = (tg.initDataUnsafe?.user?.id || "00000000").toString();
            if (!storeData.orders) return;
            const myOrders = storeData.orders.filter(o => o.userId.toString() === currentUserId);
            
            if (myOrders.length === 0) {
                el.innerHTML = `<div class="text-center py-20 text-slate-400 font-bold italic">შეკვეთები არ გაქვთ</div>`;
                return;
            }
            el.innerHTML = myOrders.map(o => `
                <div class="bg-white p-4 rounded-[25px] border border-slate-50 shadow-sm">
                    <div class="flex justify-between items-start mb-3">
                        <div>
                            <span class="text-[9px] font-black text-blue-500 uppercase tracking-tighter">#${o.orderNum}</span>
                            <h3 class="font-bold text-slate-700 text-[12px] mt-0.5">${new Date(o.date).toLocaleDateString('ka-GE')}</h3>
                        </div>
                        <span class="px-3 py-1 bg-blue-50 text-blue-600 text-[9px] font-black rounded-full uppercase">${o.status}</span>
                    </div>
                    <div class="flex justify-between items-center pt-3 border-t border-slate-50">
                        <span class="text-slate-400 text-[10px] font-bold uppercase">ჯამი:</span>
                        <span class="text-md font-black text-slate-800">${o.total}₾</span>
                    </div>
                </div>`).join('');
        }

        init();
    </script>
</body>
</html>
