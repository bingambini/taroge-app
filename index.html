<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ShoeShop - Premium Store</title>
    
    <style>
        #loader-wrapper {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        .shoe-animation {
            font-size: 60px;
            animation: initialBounce 0.6s ease-in-out infinite alternate;
        }

        @keyframes initialBounce {
            from { transform: translateY(0); }
            to { transform: translateY(-20px); }
        }

        .loading-text {
            color: white;
            margin-top: 15px;
            font-family: -apple-system, system-ui, sans-serif;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 1px;
        }

        .progress-bar {
            width: 150px;
            height: 4px;
            background: rgba(255,255,255,0.2);
            border-radius: 10px;
            margin-top: 25px;
            overflow: hidden;
        }

        .progress-line {
            width: 100%;
            height: 100%;
            background: #ffffff;
            animation: initialProgress 1.5s infinite;
        }

        @keyframes initialProgress {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .loader-hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
    </style>

    <link rel="stylesheet" href="style.css?v=2.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

    <div id="loader-wrapper">
        <div class="loader-content" style="text-align: center;">
            <div class="shoe-animation">👟</div>
            <div class="loading-text">ჩატვირთვა...</div>
            <div class="progress-bar">
                <div class="progress-line"></div>
            </div>
        </div>
    </div>
    
    <header class="header">
        <div class="container header-grid">
            <div class="header-left">
                <div id="logo-icon" class="logo-circle">B</div> 
            </div>

            <div class="header-center">
                <div id="logo" class="logo">გიო</div>
            </div>

            <div class="header-right-empty" style="width: 40px;"></div>
        </div>
    </header>

    <main class="container" id="main-content">
        <section id="hero" class="hero-section" style="display: none;"></section>

        <section id="content-section" class="section">
            <h2 id="new-arrivals-title" class="section-title">ახალი კოლექცია</h2>
            <div id="products-grid" class="products-grid">
                </div>
        </section>
    </main>

    <nav class="bottom-nav">
        <div class="nav-item active" onclick="handleNavChange('home', this)">
            <div class="nav-icon">
                <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2.5" fill="none">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                </svg>
            </div>
            <span>მთავარი</span>
        </div>
        
        <div class="nav-item" onclick="handleNavChange('categories', this)">
            <div class="nav-icon">
                <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2.5" fill="none">
                    <rect x="3" y="3" width="7" height="7"></rect>
                    <rect x="14" y="3" width="7" height="7"></rect>
                    <rect x="14" y="14" width="7" height="7"></rect>
                    <rect x="3" y="14" width="7" height="7"></rect>
                </svg>
            </div>
            <span>კატეგორია</span>
        </div>

        <div class="nav-item" onclick="handleNavChange('cart', this)">
            <div class="nav-icon cart-wrapper">
                <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2.5" fill="none">
                    <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"></path>
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <path d="M16 10a4 4 0 0 1-8 0"></path>
                </svg>
                <span id="nav-cart-badge" class="nav-badge" style="display: none;">0</span>
            </div>
            <span>კალათა</span>
        </div>

        <div class="nav-item" onclick="handleNavChange('profile', this)">
            <div class="nav-icon">
                <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2.5" fill="none">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg>
            </div>
            <span>პროფილი</span>
        </div>
    </nav>

    <script src="script.js?v=2.0"></script>
</body>
</html>
