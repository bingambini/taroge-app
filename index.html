<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shoes Store - Pro Design</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8f9fc; margin: 0; padding-bottom: 120px; }

        /* ჰედერის სტილები */
/* ჰედერის გარანტირებული გამოჩენა */
#main-header {
    position: relative; /* რომ არ გაიჭედოს სადმე */
    width: 100%;
    display: flex;
    align-items: center;
    z-index: 2000; /* ყველაფერზე მაღლა */
    transition: all 0.3s ease;
}

.floating-header {
    margin: 10px auto;
    width: 92% !important;
    border-radius: 20px;
}
        
        /* ბანერის სტილები */
        #hero-banner { 
            margin: 20px; border-radius: 35px; position: relative; 
            overflow: hidden; display: flex; align-items: center;
        }

        /* პროდუქტების სტილი */
        .product-card { background: white; border-radius: 30px; padding: 15px; position: relative; border: 1px solid #f1f5f9; }
        .badge { position: absolute; top: 12px; right: 12px; background: #ff5f5f; color: white; padding: 3px 8px; border-radius: 10px; font-size: 10px; font-weight: 800; }

        /* ქვედა ნავიგაცია */
        #bottom-nav {
            position: fixed; bottom: 20px; left: 15px; right: 15px;
            height: 85px; background: #000; border-radius: 35px;
            display: grid; grid-template-columns: repeat(4, 1fr);
            align-items: center; z-index: 1000; box-shadow: 0 15px 30px rgba(0,0,0,0.4);
        }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: #555; }
        .nav-item.active { color: #fff; }
    </style>
</head>
<body>

    <header id="main-header"></header>
    <div id="hero-banner"></div>

    <div class="px-7 mb-4 flex justify-between items-center">
        <h2 id="section-title" class="font-black text-xl text-slate-800"></h2>
        <span class="text-blue-600 text-xs font-bold">ყველა</span>
    </div>
    
    <div id="product-grid" class="grid grid-cols-2 gap-4 px-6"></div>

    <nav id="bottom-nav"></nav>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbx40aDt-cSil4iQV2y0Fe4jepNTQmYWvYeJiuItoHa-s14yuCOm9YQmOueP1OkVNas9gQ/exec";

        async function init() {
            try {
                const res = await fetch(API_URL);
                const data = await res.json();
                renderHeader(data.header);
                renderBanner(data.banner);
                renderProducts(data.latest);
                renderNavigation(data.navigation);
            } catch (e) { console.error("Load failed", e); }
        }

function renderHeader(h) {
            const el = document.getElementById('main-header');
            if (!h || h.status !== 'active') { 
                el.style.display = 'none'; 
                return; 
            }

            // 1. ბაზისური სტილები
            el.style.display = 'flex';
            el.style.backgroundColor = h.bg;
            el.style.height = h.height + "px";
            el.style.color = h.textColor;
            el.style.padding = `0 ${h.padding || 20}px`;
            
            // 2. კლასების გაწმენდა და ხელახლა დამატება
            el.className = "flex items-center transition-all duration-300";
            
            if (h.style === 'floating') {
                el.classList.add('floating-header');
            }
            
            // 3. განლაგება (Layout)
            if (h.layout === 'center') {
                el.style.justifyContent = 'center';
            } else {
                el.style.justifyContent = 'space-between';
            }

            if (h.shadow === 'sm') el.style.boxShadow = '0 4px 12px rgba(0,0,0,0.08)';

            // 4. შიგთავსი
            el.innerHTML = `
                <div class="flex items-center gap-3">
                    <img src="${h.logo}" style="width: ${h.logoSize}px; border-radius: ${h.logoRadius}%" class="object-contain">
                    <span style="font-size: ${h.fontSize}; font-weight: 800">${h.name}</span>
                </div>
                ${h.layout !== 'center' ? `<i class="fa-solid fa-bell" style="color: ${h.iconColor || h.textColor}; font-size: 1.2rem;"></i>` : ''}
            `;
        }


        function renderBanner(b) {
            const el = document.getElementById('hero-banner');
            el.style.height = b.height + "px";
            el.style.marginTop = b.marginTop + "px";
            el.style.background = b.gradient === "1" ? `linear-gradient(135deg, #1e293b, #334155)` : "#1e293b";

            el.innerHTML = `
                <div class="p-8 w-1/2 z-10">
                    <p class="font-bold opacity-70" style="font-size: ${b.subSize}px; color: ${b.titleColor}">${b.subtitle}</p>
                    <h2 class="font-black leading-tight mb-4" style="font-size: ${b.titleSize}px; color: ${b.titleColor}">${b.title}</h2>
                    <button class="bg-white text-black px-6 py-2 rounded-2xl font-black text-[10px] uppercase">${b.btnText}</button>
                </div>
                <img src="${b.image}" class="absolute -right-6 w-52 rotate-[-15deg] drop-shadow-2xl">
            `;
        }

        function renderProducts(latest) {
            document.getElementById('section-title').innerText = latest.title;
            const grid = document.getElementById('product-grid');
            grid.innerHTML = latest.items.map(p => `
                <div class="product-card">
                    ${p.badge ? `<div class="badge">${p.badge}</div>` : ''}
                    <div class="h-32 flex items-center justify-center mb-3">
                        <img src="${p.images.split(',')[0]}" class="max-h-full object-contain">
                    </div>
                    <h4 class="font-bold text-[11px] truncate text-slate-700">${p.name}</h4>
                    <p class="text-blue-600 font-black text-sm mt-1">${p.price}₾</p>
                </div>
            `).join('');
        }

        function renderNavigation(nav) {
            const container = document.getElementById('bottom-nav');
            container.innerHTML = nav.map(n => `
                <div class="nav-item ${n.Status === 'active' ? 'active' : ''}">
                    <i class="fa-solid ${n.Icon} text-xl mb-1"></i>
                    <span class="text-[10px] font-bold">${n.Label}</span>
                </div>
            `).join('');
        }

        init();
    </script>
</body>
</html>
