<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shoes Store - Pro Design</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8f9fc; margin: 0; padding-bottom: 120px; }

        /* ჰედერის სტილი */
        #main-header {
            width: 100%;
            display: flex;
            align-items: center;
            z-index: 9999;
            position: relative;
            transition: all 0.3s ease;
        }

        .header-floating {
            margin: 10px 15px !important;
            border-radius: 20px !important;
            width: calc(100% - 30px) !important;
        }

        #hero-banner { 
            margin: 20px; border-radius: 35px; position: relative; 
            overflow: hidden; display: flex; align-items: center;
        }

        .product-card { background: white; border-radius: 30px; padding: 15px; border: 1px solid #f1f5f9; }
        
        #bottom-nav {
            position: fixed; bottom: 20px; left: 15px; right: 15px;
            height: 85px; background: #000; border-radius: 35px;
            display: grid; grid-template-columns: repeat(4, 1fr);
            align-items: center; z-index: 1000;
        }
    </style>
</head>
<body>

    <header id="main-header"></header>

    <div id="hero-banner"></div>

    <div class="px-7 mb-4 flex justify-between items-center">
        <h2 id="section-title" class="font-black text-xl text-slate-800">იტვირთება...</h2>
        <span class="text-blue-600 text-xs font-bold">ყველა</span>
    </div>
    <div id="product-grid" class="grid grid-cols-2 gap-4 px-6"></div>

    <nav id="bottom-nav"></nav>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbx40aDt-cSil4iQV2y0Fe4jepNTQmYWvYeJiuItoHa-s14yuCOm9YQmOueP1OkVNas9gQ/exec";

        async function init() {
            try {
                const res = await fetch(API_URL);
                const data = await res.json();
                
                renderHeader(data.header);
                renderBanner(data.banner);
                renderProducts(data.latest);
                renderNavigation(data.navigation);
            } catch (e) {
                console.error("Load error:", e);
                document.getElementById('main-header').innerHTML = `<div class="p-4 bg-red-500 text-white text-center w-full">ჩატვირთვის შეცდომა</div>`;
            }
        }

        function renderHeader(h) {
            const el = document.getElementById('main-header');
            if (!h || h.status !== 'active') { el.style.display = 'none'; return; }

            // 1. მონაცემების დამუშავება (რიცხვებად გადაქცევა)
            const lSize = parseInt(h.logoSize) || 40; 
            const lRadius = parseInt(h.logoRadius) || 0;
            const hHeight = parseInt(h.height) || 80;
            const fSize = isNaN(h.fontSize) ? "18px" : h.fontSize + "px";

            // 2. ვიზუალური სტილები
            el.style.backgroundColor = h.bg || "#000000";
            el.style.height = hHeight + "px";
            el.style.color = h.textColor || "#ffffff";
            el.style.padding = `0 ${h.padding || 20}px`;
            
            el.className = "flex items-center transition-all";
            if (h.style === 'floating') el.classList.add('header-floating');

            el.style.justifyContent = h.layout === 'center' ? 'center' : 'space-between';
            if (h.shadow === 'sm') el.style.boxShadow = '0 4px 12px rgba(0,0,0,0.15)';

            // 3. HTML შიგთავსი
            el.innerHTML = `
                <div class="flex items-center gap-3">
                    <img src="${h.logo}" 
                         style="width: ${lSize}px; height: auto; border-radius: ${lRadius}%" 
                         onerror="this.src='https://via.placeholder.com/40'">
                    <span style="font-size: ${fSize}; font-weight: 800">${h.name || 'მაღაზია'}</span>
                </div>
                ${h.layout !== 'center' ? `<i class="fa-solid fa-bell" style="font-size: 1.2rem; color: ${h.iconColor || h.textColor}"></i>` : ''}
            `;
        }

        function renderBanner(b) {
            const el = document.getElementById('hero-banner');
            if (!b) return;
            el.style.height = (parseInt(b.height) || 180) + "px";
            el.style.marginTop = (parseInt(b.marginTop) || 20) + "px";
            el.style.background = b.gradient === "1" ? `linear-gradient(135deg, #1e293b, #334155)` : "#1e293b";

            el.innerHTML = `
                <div class="p-8 w-1/2 z-10">
                    <p class="font-bold opacity-70 text-white" style="font-size: ${b.subSize}px">${b.subtitle}</p>
                    <h2 class="font-black text-white leading-tight mb-4" style="font-size: ${b.titleSize}px">${b.title}</h2>
                    <button class="bg-white text-black px-6 py-2 rounded-2xl font-black text-[10px] uppercase">${b.btnText}</button>
                </div>
                <img src="${b.image}" class="absolute -right-6 w-52 rotate-[-15deg] drop-shadow-2xl">
            `;
        }

        function renderProducts(latest) {
            if (!latest) return;
            document.getElementById('section-title').innerText = latest.title;
            const grid = document.getElementById('product-grid');
            grid.innerHTML = latest.items.map(p => `
                <div class="product-card">
                    <div class="h-32 flex items-center justify-center mb-3">
                        <img src="${p.images.split(',')[0]}" class="max-h-full object-contain">
                    </div>
                    <h4 class="font-bold text-[11px] truncate text-slate-700">${p.name}</h4>
                    <p class="text-blue-600 font-black text-sm mt-1">${p.price}₾</p>
                </div>
            `).join('');
        }

        function renderNavigation(nav) {
            if (!nav) return;
            const container = document.getElementById('bottom-nav');
            container.innerHTML = nav.map(n => `
                <div class="flex flex-col items-center ${n.Status === 'active' ? 'text-white' : 'text-gray-500'}">
                    <i class="fa-solid ${n.Icon} text-xl mb-1"></i>
                    <span class="text-[10px] font-bold">${n.Label}</span>
                </div>
            `).join('');
        }

        init();
    </script>
</body>
</html>
