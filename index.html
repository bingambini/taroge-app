<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ShoeShop - Premium Store</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div id="loader-wrapper">
    <div class="loader-content">
        <div class="shoe-animation">👟</div>
        <div class="loading-text">ჩვენ ვამზადებთ თქვენს მაღაზიას...</div>
        <div class="progress-bar"><div class="progress-line"></div></div>
    </div>
</div>
    
    <header class="header">
        <div class="container header-grid">
            <div class="header-left">
                <div id="logo-icon" class="logo-circle">S</div>
            </div>

            <div class="header-center">
                <div id="logo" class="logo">SHOESHOP</div>
            </div>

            <div class="header-right">
                <div class="header-icons">
                    <div class="cart-icon" onclick="toggleCart()">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/>
                        </svg>
                        <span id="cart-count">0</span>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="container">
        <section id="hero" class="hero-section"></section>

        <section class="section">
            <h2 id="new-arrivals-title" class="section-title">ახალი კოლექცია</h2>
            <div id="products-grid" class="products-grid">
                <div class="loading">იტვირთება...</div>
            </div>
        </section>
    </main>

    <div id="product-modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <div id="modal-body"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
