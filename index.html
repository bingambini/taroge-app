<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shoes Store</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app-preloader"><div class="loader-spin"></div></div>
    <header id="main-header"></header>
    <div id="home-page" class="page-fade">
        <div id="hero-banner"></div>
        <div id="product-grid" class="grid grid-cols-2 gap-4 px-6 mt-4"></div>
    </div>
    <div id="cart-page" class="hidden page-fade px-6 pt-6">
        <h2 class="text-2xl font-black text-slate-800 mb-6">კალათა</h2>
        <div id="cart-items" class="space-y-4"></div>
        <div id="cart-summary" class="mt-8 border-t pt-6 hidden">
            <span id="cart-total-price" class="text-2xl font-black text-blue-600">0₾</span>
            <button onclick="placeOrder()" class="w-full bg-black text-white py-5 rounded-[25px] mt-4">შეკვეთა</button>
        </div>
    </div>
    <div id="product-details-page" class="hidden fixed inset-0 bg-white z-[30000] overflow-y-auto"></div>
    <nav id="bottom-nav"></nav>
    <script src="script.js"></script>
</body>
</html>
