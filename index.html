<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shoes Store - Fixed & Full</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        
        :root {
            --tg-theme-bg-color: #f8f9fc;
            --main-blue: #2563eb;
            --slate-900: #0f172a;
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: var(--tg-theme-bg-color); 
            margin: 0; 
            padding-bottom: 140px; 
            overflow-x: hidden; 
            -webkit-tap-highlight-color: transparent;
        }

        /* Preloader */
        #app-preloader { position: fixed; inset: 0; z-index: 999999; background: #ffffff; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.5s ease-out; }
        .shoe-icon { font-size: 60px; color: var(--main-blue); animation: kineticShoe 1.2s ease-in-out infinite; }
        @keyframes kineticShoe { 0%, 100% { transform: translateY(0) rotate(-15deg); } 50% { transform: translateY(-40px) rotate(20deg); } }

        /* Navigation */
        #bottom-nav { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); width: calc(100% - 48px); max-width: 500px; height: 85px; background: #0f172a; border-radius: 32px; display: flex; justify-content: space-around; align-items: center; z-index: 10000; box-shadow: 0 20px 40px rgba(0,0,0,0.3); }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: #64748b; transition: 0.3s; }
        .nav-item.active { color: #ffffff; transform: translateY(-5px); }
        .nav-item i { font-size: 24px; margin-bottom: 6px; }
        .cart-badge { position: absolute; top: -8px; right: -12px; background: #ff4757; color: white; font-size: 10px; font-weight: 900; min-width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 2px solid #0f172a; }

        /* Product Styles */
        .product-card { background: white; padding: 20px; border-radius: 38px; border: 1px solid #f1f5f9; transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .product-card:active { transform: scale(0.96); }
        
        #product-details-page { position: fixed; inset: 0; background: white; z-index: 30000; overflow-y: auto; display: none; }
        .slider-container { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; margin: 0 -24px; padding: 0 24px; }
        .slider-item { min-width: 100%; scroll-snap-align: start; padding: 10px; }
        .slider-item img { width: 100%; aspect-ratio: 1/1; object-fit: contain; background: #f8fafc; border-radius: 40px; }

        .option-btn { padding: 18px 28px; border-radius: 22px; font-weight: 800; border: 2px solid #f1f5f9; background: white; transition: 0.3s; }
        .option-btn.selected { border-color: var(--main-blue); background: var(--main-blue); color: white !important; }

        /* Sheets */
        #product-sheet-overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(8px); z-index: 20000; display: none; }
        #product-sheet { position: fixed; bottom: 0; left: 0; right: 0; background: white; border-top-left-radius: 50px; border-top-right-radius: 50px; padding: 40px 30px; transform: translateY(100%); transition: 0.5s cubic-bezier(0.2, 1, 0.3, 1); z-index: 20001; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="app-preloader">
        <div class="shoe-icon"><i class="fa-solid fa-shoe-prints"></i></div>
        <p class="mt-8 font-black text-slate-900 tracking-widest uppercase text-xs">იტვირთება</p>
    </div>

    <header id="main-header" class="sticky top-0 z-[9999] flex items-center px-6"></header>

    <main id="app-content">
        <div id="home-page">
            <div id="hero-banner" class="mx-auto mt-6 rounded-[40px] overflow-hidden relative shadow-2xl w-[calc(100%-40px)]"></div>
            <div id="product-grid" class="grid grid-cols-2 gap-5 px-6 mt-8"></div>
        </div>

        <div id="cart-page" class="hidden px-6 pt-8">
            <h2 class="text-3xl font-black mb-8">კალათა</h2>
            <div id="cart-items" class="space-y-5"></div>
            <div id="promo-section" class="mt-10 hidden">
                <div class="bg-white p-5 rounded-[30px] border border-slate-50 shadow-sm flex gap-3">
                    <input id="promo-input" type="text" placeholder="პრომო კოდი" class="flex-1 bg-slate-50 border-none rounded-2xl px-5 font-bold h-14 outline-none">
                    <button onclick="applyPromo()" class="bg-black text-white px-8 rounded-2xl font-black text-xs uppercase">OK</button>
                </div>
                <div id="promo-msg" class="text-[11px] font-bold mt-3 px-2"></div>
            </div>
            <div id="cart-summary" class="mt-8 mb-32 bg-white p-8 rounded-[40px] shadow-2xl hidden">
                <div class="flex justify-between items-center mb-6">
                    <span class="text-slate-400 font-bold">ჯამი:</span>
                    <span id="cart-total-price" class="text-2xl font-black text-blue-600">0₾</span>
                </div>
                <button onclick="switchPage('checkout')" class="w-full bg-slate-900 text-white py-6 rounded-[28px] font-black text-lg">გაფორმება</button>
            </div>
        </div>

        <div id="orders-page" class="hidden px-6 pt-8 pb-24">
            <h2 class="text-3xl font-black mb-8">შეკვეთები</h2>
            <div id="orders-list" class="space-y-5"></div>
        </div>

        <div id="profile-page" class="hidden"></div>

        <div id="checkout-page" class="hidden px-6 pt-8 pb-24">
            <h2 class="text-2xl font-black mb-8">მონაცემები</h2>
            <div class="space-y-4">
                <input id="order-name" type="text" placeholder="სახელი გვარი" class="w-full p-6 rounded-2xl border border-slate-100 font-bold bg-white">
                <input id="order-phone" type="tel" placeholder="ტელეფონი" class="w-full p-6 rounded-2xl border border-slate-100 font-bold bg-white">
                <input id="order-address" type="text" placeholder="მისამართი" class="w-full p-6 rounded-2xl border border-slate-100 font-bold bg-white">
                <div class="p-8 bg-blue-50 rounded-[32px] mt-6 flex justify-between items-center">
                    <span class="font-bold text-blue-900">სულ:</span>
                    <span id="checkout-total-price" class="text-3xl font-black text-blue-600">0₾</span>
                </div>
                <button onclick="switchPage('payment')" class="w-full bg-blue-600 text-white py-6 rounded-[28px] font-black text-lg shadow-xl">გადახდა</button>
            </div>
        </div>

        <div id="payment-page" class="hidden px-6 pt-10 text-center">
            <h2 class="text-2xl font-black mb-10">გადახდის მეთოდი</h2>
            <div class="space-y-4" id="payment-methods">
                <div onclick="processFinalOrder('card', 'ბარათით')" class="bg-white p-8 rounded-[35px] border border-slate-50 flex items-center justify-between shadow-sm">
                    <span class="font-black text-slate-800">ონლაინ ბარათით</span>
                    <i class="fa-solid fa-credit-card text-blue-600"></i>
                </div>
                <div onclick="processFinalOrder('cash', 'ნაღდი')" class="bg-white p-8 rounded-[35px] border border-slate-50 flex items-center justify-between shadow-sm">
                    <span class="font-black text-slate-800">კურიერთან ნაღდი</span>
                    <i class="fa-solid fa-truck text-green-600"></i>
                </div>
            </div>
        </div>
    </main>

    <div id="product-details-page"></div>
    <div id="product-sheet-overlay" onclick="closeProductSheet()"></div>
    <div id="product-sheet"><div id="sheet-content"></div></div>
    
    <nav id="bottom-nav"></nav>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbzlFXWDikCWQFa1FhMMbN0DtaKArKyK6-NoJqN0zK3k4gDsSPz6YK57Hd_B63bOyofPMg/exec";
        const PROMO_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQH2mZB4PnZn6hJJRPgC_Ry0HTt7BvKiNmcNGyx7PVOMHY0rNFqhM4MneVoRI3kT00y6vxMMOoHbipA/pub?output=csv";
        
        let storeData = null;
        let cart = JSON.parse(localStorage.getItem('cart')) || [];
        let activeDiscount = null;

        async function init() {
            try {
                const res = await fetch(API_URL);
                storeData = await res.json();
                renderUI();
                document.getElementById('app-preloader').style.opacity = '0';
                setTimeout(() => document.getElementById('app-preloader').style.display = 'none', 500);
            } catch (e) { console.error(e); }
        }

        function renderUI() {
            renderHeader(storeData.header);
            renderHero(storeData.banner);
            renderGrid(storeData.latest.items);
            renderNav(storeData.navigation);
            renderProfile(storeData.profileMenu);
            updateCartBadge();
        }

        function renderHeader(h) {
            const el = document.getElementById('main-header');
            el.style.backgroundColor = h.bg;
            el.style.height = h.height + "px";
            el.innerHTML = `<div class="flex items-center gap-4"><img src="${h.logo}" class="w-10 h-10 rounded-full"><span class="font-black text-white text-lg">${h.name}</span></div>`;
        }

        function renderHero(b) {
            const el = document.getElementById('hero-banner');
            el.style.height = "220px";
            el.style.background = "linear-gradient(135deg, #0f172a 0%, #1e293b 100%)";
            el.innerHTML = `
                <div class="p-8 relative z-10 w-2/3">
                    <h2 class="text-white font-black text-2xl leading-tight">${b.title}</h2>
                    <button class="mt-6 bg-white text-black px-6 py-3 rounded-2xl font-black text-[10px] uppercase">${b.btnText}</button>
                </div>
                <img src="${b.image}" class="absolute right-[-20px] bottom-[-10px] w-1/2 transform rotate-[-12deg]">`;
        }

        function renderGrid(items) {
            document.getElementById('product-grid').innerHTML = items.map((p, i) => `
                <div onclick="openSheet(${i})" class="product-card">
                    <div class="h-32 bg-slate-50 rounded-[28px] flex items-center justify-center mb-4 overflow-hidden">
                        <img src="${p.images.split(',')[0]}" class="h-24 object-contain">
                    </div>
                    <h4 class="font-black text-xs text-slate-800 truncate">${p.name}</h4>
                    <p class="text-blue-600 font-black text-lg mt-1">${p.price}₾</p>
                </div>`).join('');
        }

        function openSheet(idx) {
            const p = storeData.latest.items[idx];
            document.getElementById('sheet-content').innerHTML = `
                <div class="text-center">
                    <div class="h-48 bg-slate-50 rounded-[40px] flex items-center justify-center mb-8"><img src="${p.images.split(',')[0]}" class="h-36 object-contain"></div>
                    <h3 class="text-2xl font-black text-slate-900">${p.name}</h3>
                    <p class="text-3xl font-black text-blue-600 mt-4">${p.price}₾</p>
                    <button onclick="showDetails('${p.id}')" class="w-full mt-8 bg-slate-900 text-white py-6 rounded-[28px] font-black">დეტალურად ნახვა</button>
                </div>`;
            document.getElementById('product-sheet-overlay').style.display = 'block';
            setTimeout(() => document.getElementById('product-sheet').style.transform = 'translateY(0)', 50);
        }

        function closeProductSheet() {
            document.getElementById('product-sheet').style.transform = 'translateY(100%)';
            setTimeout(() => document.getElementById('product-sheet-overlay').style.display = 'none', 400);
        }

        function showDetails(id) {
            closeProductSheet();
            const p = storeData.productDetails.find(x => x.id == id);
            const imgs = (p.fullImages || p.images).split(',');
            const sizes = (p.sizes || "").toString().split(',').filter(x=>x);
            const colors = (p.colors || "").toString().split(',').filter(x=>x);

            document.getElementById('product-details-page').innerHTML = `
                <div class="px-6 pt-8 pb-32">
                    <button onclick="hideDetails()" class="mb-8 font-black text-slate-400"><i class="fa-solid fa-arrow-left"></i> უკან</button>
                    <div class="slider-container mb-10">${imgs.map(img => `<div class="slider-item"><img src="${img.trim()}"></div>`).join('')}</div>
                    <h1 class="text-3xl font-black text-slate-900">${p.name}</h1>
                    <p class="text-3xl font-black text-blue-600 mt-4">${p.price}₾</p>
                    <p class="text-slate-500 mt-6 text-sm">${p.description || 'მაღალი ხარისხის მოდელი.'}</p>
                    <div class="mt-8">
                        <p class="text-[11px] font-black text-slate-400 uppercase tracking-widest mb-4">ზომა</p>
                        <div class="flex flex-wrap gap-3">${sizes.map(s => `<button onclick="selectOpt(this, 'size')" class="option-btn size-opt">${s.trim()}</button>`).join('')}</div>
                    </div>
                    <div class="mt-8">
                        <p class="text-[11px] font-black text-slate-400 uppercase tracking-widest mb-4">ფერი</p>
                        <div class="flex flex-wrap gap-3">${colors.map(c => `<button onclick="selectOpt(this, 'color')" class="option-btn color-opt">${c.trim()}</button>`).join('')}</div>
                    </div>
                </div>
                <div class="fixed bottom-10 left-0 right-0 px-8"><button id="add-btn" disabled class="w-full bg-slate-200 text-slate-400 py-6 rounded-[30px] font-black text-lg">აირჩიეთ პარამეტრები</button></div>`;
            document.getElementById('product-details-page').style.display = 'block';
            window.scrollTo(0,0);
        }

        function hideDetails() { document.getElementById('product-details-page').style.display = 'none'; }

        function selectOpt(btn, type) {
            document.querySelectorAll(`.${type}-opt`).forEach(el => el.classList.remove('selected'));
            btn.classList.add('selected');
            const s = document.querySelector('.size-opt.selected');
            const c = document.querySelector('.color-opt.selected');
            const addBtn = document.getElementById('add-btn');
            if (s && c) {
                addBtn.disabled = false;
                addBtn.innerText = "კალათაში დამატება";
                addBtn.className = "w-full bg-blue-600 text-white py-6 rounded-[30px] font-black text-lg shadow-xl";
                addBtn.onclick = handleAddToCart; // აქ იყო შეცდომა
            }
        }

        function handleAddToCart() {
            const name = document.querySelector('h1').innerText;
            const price = parseFloat(document.querySelector('.text-blue-600').innerText);
            const size = document.querySelector('.size-opt.selected').innerText;
            const color = document.querySelector('.color-opt.selected').innerText;
            const img = document.querySelector('.slider-item img').src;

            cart.push({ id: Date.now(), name, price, size, color, img });
            localStorage.setItem('cart', JSON.stringify(cart));
            updateCartBadge();

            const b = document.getElementById('add-btn');
            b.innerText = "✅ დაემატა";
            b.className = "w-full bg-green-500 text-white py-6 rounded-[30px] font-black text-lg";
            setTimeout(hideDetails, 800);
        }

        function renderCartItems() {
            const container = document.getElementById('cart-items');
            if (cart.length === 0) {
                container.innerHTML = `<div class="text-center py-20 text-slate-300 font-bold">კალათა ცარიელია</div>`;
                document.getElementById('cart-summary').classList.add('hidden');
                document.getElementById('promo-section').classList.add('hidden');
                return;
            }
            document.getElementById('cart-summary').classList.remove('hidden');
            document.getElementById('promo-section').classList.remove('hidden');
            let total = 0;
            container.innerHTML = cart.map((item, idx) => {
                total += item.price;
                return `
                <div class="bg-white p-5 rounded-[32px] flex items-center gap-5 shadow-sm">
                    <img src="${item.img}" class="w-20 h-20 object-contain bg-slate-50 rounded-2xl p-2">
                    <div class="flex-1">
                        <h4 class="font-black text-slate-900 text-sm">${item.name}</h4>
                        <p class="text-[10px] text-slate-400 font-black mt-1 uppercase">${item.size} / ${item.color}</p>
                        <div class="flex justify-between items-center mt-2">
                            <span class="text-blue-600 font-black text-lg">${item.price}₾</span>
                            <button onclick="removeFromCart(${idx})" class="text-red-500 font-black text-xs">წაშლა</button>
                        </div>
                    </div>
                </div>`;
            }).join('');
            let final = total;
            if (activeDiscount) final = activeDiscount.type === 'percent' ? total * (1 - activeDiscount.val / 100) : total - activeDiscount.val;
            document.getElementById('cart-total-price').innerText = Math.round(final) + "₾";
            document.getElementById('checkout-total-price').innerText = Math.round(final) + "₾";
        }

        function removeFromCart(idx) { cart.splice(idx, 1); localStorage.setItem('cart', JSON.stringify(cart)); updateCartBadge(); renderCartItems(); }

        function switchPage(p) {
            ['home', 'cart', 'orders', 'profile', 'checkout', 'payment'].forEach(id => document.getElementById(id+'-page').classList.add('hidden'));
            document.getElementById(p+'-page').classList.remove('hidden');
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById('nav-'+p)?.classList.add('active');
            if(p === 'cart') renderCartItems();
            if(p === 'orders') renderOrders();
            window.scrollTo(0,0);
        }

        function renderOrders() {
            const list = document.getElementById('orders-list');
            const uid = (window.Telegram?.WebApp?.initDataUnsafe?.user?.id || "0").toString();
            const my = (storeData.orders || []).filter(o => o.userId.toString() === uid);
            if(my.length === 0) { list.innerHTML = `<div class="text-center py-20 text-slate-300 font-bold">შეკვეთები არ არის</div>`; return; }
            list.innerHTML = my.map(o => `
                <div class="bg-white p-7 rounded-[40px] border border-slate-50 shadow-sm">
                    <div class="flex justify-between mb-4"><span class="text-[10px] font-black text-blue-600">ID: ${o.orderId}</span><span class="bg-blue-50 text-blue-600 px-4 py-1 rounded-full text-[10px] font-black uppercase">${o.status}</span></div>
                    <p class="text-sm font-bold text-slate-800 mb-4">${o.items}</p>
                    <div class="pt-4 border-t flex justify-between items-center"><span class="text-slate-400 text-xs font-bold">ჯამი:</span><span class="text-xl font-black">${o.total}₾</span></div>
                </div>`).join('');
        }

        function renderNav(items) {
            document.getElementById('bottom-nav').innerHTML = items.map(it => `
                <div id="nav-${it.action}" onclick="switchPage('${it.action}')" class="nav-item ${it.action === 'home' ? 'active' : ''}">
                    <div class="relative"><i class="fa-solid ${it.icon}"></i>${it.action === 'cart' ? `<div id="cart-count" class="cart-badge hidden">0</div>` : ''}</div>
                    <span>${it.name}</span>
                </div>`).join('');
        }

        function renderProfile(menu) {
            const user = window.Telegram?.WebApp?.initDataUnsafe?.user || { first_name: "სტუმარი", id: "0" };
            document.getElementById('profile-page').innerHTML = `
                <div class="p-12 text-center bg-white mb-8 rounded-b-[60px] shadow-sm"><div class="w-24 h-24 bg-slate-100 rounded-[35px] mx-auto mb-6 flex items-center justify-center text-4xl font-black text-slate-300">${user.first_name[0]}</div><h2 class="font-black text-2xl">${user.first_name}</h2><p class="text-slate-400 text-xs font-bold mt-2">ID: ${user.id}</p></div>
                <div class="px-8 space-y-4">${menu.map(m => `<div onclick="switchPage('${m.action}')" class="bg-white p-6 rounded-[30px] flex items-center justify-between shadow-sm"><div class="flex items-center gap-4"><i class="fa-solid ${m.icon} text-slate-400"></i><span class="font-black text-sm text-slate-700">${m.label}</span></div><i class="fa-solid fa-chevron-right text-[10px] text-slate-200"></i></div>`).join('')}</div>`;
        }

        function updateCartBadge() { const el = document.getElementById('cart-count'); if(el) { el.innerText = cart.length; cart.length > 0 ? el.classList.remove('hidden') : el.classList.add('hidden'); } }

        async function processFinalOrder(id, title) {
            const params = new URLSearchParams({
                action: "placeOrder",
                userId: (window.Telegram?.WebApp?.initDataUnsafe?.user?.id || "0").toString(),
                customerName: document.getElementById('order-name').value,
                phone: document.getElementById('order-phone').value,
                address: `${document.getElementById('order-address').value} [${title}]`,
                items: cart.map(i => `${i.name} (${i.size})`).join(', '),
                total: document.getElementById('checkout-total-price').innerText.replace('₾',''),
                promo: activeDiscount ? activeDiscount.code : "არა"
            });
            try {
                fetch(`${API_URL}?${params.toString()}`, { mode: 'no-cors' });
                localStorage.removeItem('cart'); cart = []; updateCartBadge(); alert("შეკვეთა მიღებულია!"); window.Telegram.WebApp.close();
            } catch (e) { alert("შეცდომაა"); }
        }

        init();
    </script>
</body>
</html>
